<style>
/* Écran d'ouverture (refonte 2026-11) : bonjour, puis une carte sombre « le service du jour » (midi/soir + objectif du mois),
   deux tuiles (hygiène, à commander), le programme, le dernier service, et les outils de Julien. Chaque bloc mène à sa partie. */
:root{
  --bg:#f5f2ea; --surface:#fffdf8; --sunken:#f1ece1; --line:#e6dfd0; --fg:#1f1b14; --muted:#71695a;
  --accent:#f2a516; --accent-ink:#2a1d00; --accent-soft:#fcefd2; --go:#2f7d4f; --go-soft:#e2f1e7; --warn:#b85a0c; --warn-soft:#fbe9d6; --danger:#c23a2b;
  --priv:#c2410c; --priv-soft:#fdeadf; --trait:#2f5d9e; --trait-soft:#e4ecf8; --note:#2f7d4f; --note-soft:#e3f2e8; --theme:#7c3aed; --theme-soft:#ede4fb;
  --hero1:#2a2117; --hero2:#3b2c18; --hero-fg:#fff7e6; --hero-muted:#d8c8a6; --hero-line:rgba(255,255,255,.1); --hero-glass:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(60,40,0,.04),0 8px 22px -14px rgba(60,40,0,.25);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13110d; --surface:#1d1a15; --sunken:#17150f; --line:#302b22; --fg:#f4efe3; --muted:#a59d8c;
  --accent:#f5b232; --accent-ink:#231800; --accent-soft:#3a2e12; --go:#5fbf86; --go-soft:#16301f; --warn:#f0954a; --warn-soft:#3a2614; --danger:#e8705f;
  --priv:#fb923c; --priv-soft:#3b2414; --trait:#8db7ee; --trait-soft:#1b2a40; --note:#5fbf86; --note-soft:#16301f; --theme:#c4a5f5; --theme-soft:#2a1f3d;
  --hero1:#2b2214; --hero2:#3e2f16; --hero-muted:#cdbb96;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:12px}
.wrap>.pbar{margin-bottom:0}
h1,h2,h3{font-family:var(--display);margin:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--sunken);color:var(--fg)}
.ic svg{width:22px;height:22px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Bonjour */
.hello{margin:6px 2px 2px}
.hello h1{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.05;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--muted);font-size:17px;font-weight:600}
.hello p b{color:var(--fg)}

.bell-cta{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);
  background:var(--accent-soft);color:var(--fg);font:inherit;font-weight:800;font-size:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.newsw{display:grid;grid-template-rows:0fr;margin-bottom:-12px;transition:grid-template-rows .3s cubic-bezier(.2,.85,.25,1),margin-bottom .3s cubic-bezier(.2,.85,.25,1)}
.newsw>div{overflow:hidden;min-height:0;padding:0 2px;margin:0 -2px}
.newsw.on{grid-template-rows:1fr;margin-bottom:0}
.newsw .bell-cta{margin:2px 0 6px}
.bell-cta span{flex:1}
.bell-cta .ic{background:var(--accent);color:var(--accent-ink);width:36px;height:36px;border-radius:11px}
.bell-cta b{font-size:22px;color:var(--muted)}

/* Le service du jour : la carte forte de la page */
.hero{border-radius:26px;padding:16px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--hero-fg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(245,178,50,.32),transparent 70%);pointer-events:none;z-index:-1}
.hh{display:flex;align-items:center;gap:10px}
.hh h2{flex:1;font-size:13px;font-weight:800;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--body)}
.ouvgo{flex:none;border:1px solid var(--hero-line);background:var(--hero-glass);color:var(--hero-fg);font:inherit;font-size:13px;font-weight:700;height:34px;padding:0 12px;border-radius:11px;cursor:pointer}
.ouvp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .opill{white-space:nowrap;width:auto;height:58px;border-radius:16px;font-size:16px;background:var(--hero-glass);border:1.5px solid var(--hero-line);color:var(--hero-muted);flex-direction:row;gap:10px;justify-content:flex-start;padding:0 14px}
.hero .opill small{font-size:13px;margin-left:auto;text-decoration:none!important;opacity:1;display:flex;align-items:center;gap:6px}
.hero .opill small::before{content:"";width:9px;height:9px;border-radius:50%;background:#8a7f6a}
.hero .opill.on{background:rgba(111,211,154,.12);border-color:rgba(111,211,154,.45);color:var(--hero-fg)}
.hero .opill.on small{color:#8fe0b0}
.hero .opill.on small::before{background:#6fd39a;box-shadow:0 0 0 4px rgba(111,211,154,.22)}
.ouvn{grid-column:1/-1;margin:0;font-size:14px;font-weight:700;color:var(--hero-muted)}
.goal{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;padding-top:14px;border-top:1px solid var(--hero-line)}
.goal{min-height:122px}
.gsk{display:block;height:14px;border-radius:7px;background:rgba(255,255,255,.1)}
.goal .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.goal .row span{font-size:13px;font-weight:700;color:var(--hero-muted)}
.goal .row b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.goal .row+.row{margin-top:-4px}
.goal.still .bar i{animation:none}
.goal .row em{margin-left:auto;font-style:normal;font-family:var(--display);font-size:22px;font-weight:800;color:var(--accent)}
.goal .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.goal .bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#f7c04a,var(--accent));animation:fill 1.1s .15s cubic-bezier(.2,.8,.2,1) backwards}
.goal.win .bar i{background:linear-gradient(90deg,#6cc58f,#3fa36a)}
.goal.win .row em{color:#8fe0b0}
@keyframes fill{from{width:0}}
.goal p{margin:0;font-size:14px;font-weight:700;color:#8fe0b0}
.goal p.n{color:var(--hero-muted);font-weight:600}

/* Tuiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile,.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);color:var(--fg);text-decoration:none;display:flex;flex-direction:column;transition:scale .12s ease;min-width:0}
.tile:active,.card:active{scale:.98}
.tile{padding:14px;gap:8px}
.th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile h2{font-size:16px;font-weight:800;font-family:var(--body);margin-top:2px}
.tile .big{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1;margin-top:2px}
.tile #hyg,.tile #cmd{display:flex;flex-direction:column;gap:6px}
.tile .big small{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:700;letter-spacing:0}
.tile .sub{font-size:13px;font-weight:600;color:var(--muted);line-height:1.3}
.tile .mini{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.tile .mini .no{color:var(--warn)} .tile .mini .bad{color:var(--danger)}
.pill:empty{display:none}
.pill{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.todo{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--go-soft);color:var(--go)}
.hyg.todo{border:1.5px solid color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 5%,var(--surface))}
.hyg.todo .ic{background:var(--warn-soft);color:var(--warn)}
.hyg.fine .ic,.cmd0 .ic{background:var(--go-soft);color:var(--go)}
.tile.tool .sub{font-size:13px}

/* Cartes */
.card{padding:4px 0 6px}
.ch{display:flex;align-items:center;gap:12px;padding:12px 14px 10px}
.ch h2{flex:1;min-width:0;font-size:19px;font-weight:800}
.ch .go{flex:none;color:var(--muted);font-size:24px;font-weight:700;line-height:1}
.empty{color:var(--muted);font-size:15px;padding:2px 16px 10px}
.empty b{color:var(--go)}
.dayl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 16px 6px}
.ev{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:8px 14px;color:var(--fg)}
.ev+.ev{border-top:1px solid var(--line)}
.ev .e{height:46px;border-radius:13px;display:grid;place-items:center;background:var(--soft,var(--sunken));color:var(--c,var(--fg));font-family:var(--display);font-weight:800;font-size:16px;line-height:1}
.ev .e.emo{font-size:21px}
.ev .t{min-width:0}
.ev .t b{display:block;font-size:16px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.ev .t small{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.ev.privatisation{--c:var(--priv);--soft:var(--priv-soft)} .ev.traiteur{--c:var(--trait);--soft:var(--trait-soft)} .ev.note{--c:var(--note);--soft:var(--note-soft)} .ev.theme{--c:var(--theme);--soft:var(--theme-soft)}
.st{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--fg);white-space:nowrap}
.st.confirme{background:var(--go-soft);color:var(--go)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 8px}
.kp div{background:var(--sunken);border-radius:15px;padding:10px 12px;min-width:0}
.kp small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.kp b{display:block;font-family:var(--display);font-size:26px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .best{grid-column:1/-1;background:var(--go-soft);color:var(--go);font-weight:800;font-size:14px;padding:9px 12px}
.fill{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 14px 8px;height:52px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;
  background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -8px color-mix(in srgb,var(--accent) 90%,#000)}
.sect{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 4px -4px}

@view-transition{navigation:auto}
.pbar{view-transition-name:pbar}
@media (prefers-reduced-motion:reduce){.newsw{transition:none}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}.goal .bar i{animation:none}.tile,.card{transition:none}}
@media (max-width:350px){.grid2{grid-template-columns:1fr}}
</style>
</head>

<script>
const API="https://kokjumjhpasxxxrpspng.supabase.co/rest/v1/rpc/";
const KEY="sb_publishable_HIJXH1eJ_CP-A4G3AecDKg_NbBUD0m2";
let CODE=null;try{CODE=localStorage.getItem("commande2b-code")}catch{}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
async function rpc(fn,args={}){
  const r=await fetch(API+fn,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({p_code:CODE,...args})});
  if(!r.ok){let e={};try{e=await r.json()}catch{}const err=new Error(e.message||"net");err.code=e.code;throw err}
  const t=await r.text();return t?JSON.parse(t):null;
}
const lost=e=>{if(e&&e.code==="28000"){try{localStorage.removeItem("commande2b-code")}catch{}location.replace("./");return true}return false};
const cache=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch{return null}};

/* Dates (heure locale) */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date();const plus=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return d};
const OUV=window.Profil&&Profil.ouverture;
const TODAY=iso(now),TOMORROW=iso(plus(1));
// « Hier » = le dernier jour où l'on était ouvert (le lundi : vendredi), pour ne jamais réclamer les chiffres d'un jour fermé
const YESTERDAY=(OUV&&OUV.dernierOuvert(TODAY))||iso(plus(-1)),Y=new Date(YESTERDAY+"T12:00:00");
const VEILLE=YESTERDAY===iso(plus(-1));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nf0=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});

/* Bonjour */
const prenom=(window.Profil&&Profil.noms[Profil.get()])||"";
const h=now.getHours();
$("#hi").textContent=`${h>=18||h<5?"Bonsoir":"Bonjour"}${prenom?" "+prenom:""} 👋`;
const jour=cap(now.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}));
$("#date").innerHTML=`<b>${esc(jour)}</b> · ${h<15?"bon service !":h<18?"bonne fin de journée !":"bon service ce soir !"}`;

/* Nouveautés de l'équipe (sonnette) */
function news(k){const b=$("#news");if(k)b.hidden=false;$("#newsW").classList.toggle("on",!!k);if(!k)setTimeout(()=>{if(!$("#newsW").classList.contains("on"))b.hidden=true},320);$("#newsT").textContent=k===1?"1 nouveauté de l'équipe":`${k} nouveautés de l'équipe`}
document.addEventListener("2b-notifs",e=>news(e.detail));
if(window.Profil&&Profil.notifs){Profil.notifs.load();news(Profil.notifs.unread())}
$("#news").onclick=()=>window.Profil&&Profil.notifs.open();

/* Au programme : aujourd'hui et demain */
const TYPES={privatisation:"🏠",traiteur:"🚚",theme:"🎉",note:"📌"};
const STAT={option:"En option",confirme:"Confirmé"};
const TLAB={privatisation:"Privatisation",traiteur:"Traiteur",theme:"Soirée à thème",note:"Pense-bête"};
function drawEv(list){
  list=(list||[]).filter(e=>e.statut!=="annule");
  const hm=t=>String(t||"").slice(0,5).replace(":","h");
  const part=(d,l)=>{const xs=list.filter(e=>e.jour===d).sort((a,b)=>(a.heure||"99").localeCompare(b.heure||"99"));if(!xs.length)return "";
    return `<div class="dayl">${l}</div>`+xs.map(e=>{const det=[TLAB[e.type]||"",e.personnes?e.personnes+" pers.":"",e.type==="traiteur"&&e.lieu?e.lieu:""].filter(Boolean).map(esc).join(" · ");
      return `<div class="ev ${esc(e.type)}" data-ev="${esc(e.id)}" data-j="${esc(e.jour)}"><span class="e${e.heure?"":" emo"}" aria-hidden="true">${e.heure?esc(hm(e.heure)):(TYPES[e.type]||"📅")}</span><span class="t"><b>${esc(e.client)}</b><small>${det||"&nbsp;"}</small></span>${e.type!=="note"&&STAT[e.statut]?`<span class="st ${esc(e.statut)}">${STAT[e.statut]}</span>`:"<span></span>"}</div>`}).join("")};
  const html=part(TODAY,"Aujourd'hui")+part(TOMORROW,"Demain");
  $("#evs").style.padding="";
  $("#evs").innerHTML=html||`<div class="empty">Rien de prévu aujourd'hui ni demain.</div>`;
}
$("#cEv").addEventListener("click",e=>{const x=e.target.closest("[data-ev]");if(!x)return;e.preventDefault();location.href=`evenements.html#ev=${encodeURIComponent(x.dataset.ev)}&j=${x.dataset.j}`});

/* À commander : total et par fournisseur (Cuisine et Bar & Salle) */
function drawCmd(d){
  const ps=((d&&d.produits)||[]).filter(p=>p.acommander);
  $("#cCmd").classList.toggle("cmd0",!ps.length);
  if(!ps.length){$("#cmd").innerHTML=`<div class="big">✓</div><div class="sub">Rien à commander pour l'instant</div>`;return}
  const by={};ps.forEach(p=>by[p.fournisseur]=(by[p.fournisseur]||0)+1);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $("#cmd").innerHTML=`<div class="big num">${ps.length}</div><div class="sub">article${ps.length>1?"s":""} · ${top.slice(0,2).map(([f,n])=>esc(f)+" "+n).join(" · ")}${top.length>2?" · …":""}</div>`;
}
/* Hier : CA et clients ; si rien n'est noté, un gros bouton pour le faire */
const v=(r,k)=>r&&typeof r[k]==="number"?r[k]:null;
const add=(...a)=>{const x=a.filter(n=>n!=null);return x.length?x.reduce((s,n)=>s+n,0):null};
const jca=r=>!r?null:v(r,"ca_jour")!=null?v(r,"ca_jour"):add(v(r,"ca_midi"),v(r,"ca_soir"));   // CA d'un jour (caisse)
function drawHier(month){
  $("#hier").style.padding="";
  $("#hierT").textContent=(VEILLE?"Hier, ":"Dernier service, ")+Y.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric"});
  const r=(month||{})[YESTERDAY];
  const ca=v(r,"ca_jour")!=null?v(r,"ca_jour"):add(v(r,"ca_midi"),v(r,"ca_soir"));   // total de la caisse s'il est noté
  const cl=add(v(r,"clients_midi_sp"),v(r,"clients_midi_emp"),v(r,"clients_midi"),v(r,"clients_soir_sp"),v(r,"clients_soir_emp"),v(r,"clients_soir"));
  $("#cHier").href="chiffres.html#j="+YESTERDAY;
  if(ca==null&&cl==null){$("#hier").innerHTML=`<div class="empty">Les chiffres ${VEILLE?"d'hier":"de "+Y.toLocaleDateString("fr-FR",{weekday:"long"})} ne sont pas encore notés.</div><div class="fill">✍️ Les noter maintenant</div>`;return}
  const all=Object.values(month||{}).map(jca).filter(x=>x!=null&&x>0),best=ca!=null&&all.length>=3&&ca>=Math.max(...all);
  $("#hier").innerHTML=`<div class="kp"><div><small>Chiffre d'affaires</small><b class="num">${ca==null?"–":nf0.format(ca)+" €"}</b></div><div><small>Clients</small><b class="num">${cl==null?"–":nf0.format(cl)}</b></div>${best?`<div class="best">🏆 Meilleure journée du mois !</div>`:""}</div>`;
}

/* Hygiène : Julien et Eric voient tout ; Claire et Thierry la vitrine */
const ME=(window.Profil&&Profil.get())||"";const FULL=!["claire","thierry"].includes(ME);
const NAPP=FULL?7:1,MOMENT=now.getHours()<15?"matin":"soir";
function drawHyg(d){
  if(!d){return}
  const rel=(d.releves||[]).filter(r=>r.jour===TODAY&&r.moment===MOMENT&&(FULL||r.appareil==="vitrine"));
  const faits=new Set(rel.map(r=>r.appareil)).size;const tous=faits>=NAPP;
  const anomalie=rel.some(r=>!r.ok&&!r.action);
  const ferme=OUV&&!OUV.ouvert(TODAY,MOMENT==="matin"?"midi":"soir")&&!tous;   // fermé : pas de relevé à faire
  const c=$("#cHyg");c.classList.toggle("todo",!tous&&!ferme);c.classList.toggle("fine",tous);c.classList.toggle("ferme",!!ferme);
  const pl=$("#hygS");pl.className="pill"+(tous?" ok":ferme?"":" todo");pl.textContent=tous?"✓ Fait":ferme?"Fermé":"À faire";
  let h=ferme?`<div class="big" aria-hidden="true">😌</div><div class="sub">Fermé ${MOMENT==="matin"?"ce midi":"ce soir"} : pas de relevé</div>`
    :`<div class="big num">${Math.min(faits,NAPP)}<small> / ${NAPP}</small></div><div class="sub">${FULL?"Frigos et congélateurs":"Vitrine"} · relevé du ${MOMENT}</div>`;
  const mini=[];
  if(FULL){
    const days=f=>{const h=(d.huile||[]).filter(x=>x.friteuse===f).sort((a,b)=>String(b.le).localeCompare(String(a.le)))[0];if(!h)return "–";const a=new Date(h.le);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);const n=Math.round((b-a)/864e5);return n===0?"neuve":n+" j"};
    mini.push(`<span>🍟 Huile : F1 ${days(1)} · F2 ${days(2)}</span>`);
    const lav=[["frigo_c1","Frigo cuisine 1"],["frigo_p","Frigo plonge"]].filter(([k])=>!(d.nettoyage||[]).some(n=>n.appareil===k&&Date.now()-new Date(n.le)<7*864e5));
    if(lav.length)mini.push(`<span class="no">🧽 ${lav.length} frigo${lav.length>1?"s":""} à laver</span>`);
    const run=(d.refroid||[]).filter(x=>!x.fin);
    if(run.length){const m=Math.max(...run.map(x=>Math.floor((Date.now()-new Date(x.debut))/60000)));mini.push(`<span class="${m>120?"no":""}">❄️ En cellule : ${run.length} · ${m<60?m+" min":Math.floor(m/60)+" h "+pad(m%60)}</span>`)}
  }
  if(anomalie)mini.push(`<span class="bad">⚠️ Température trop haute</span>`);
  if(mini.length)h+=`<div class="mini">${mini.join("")}</div>`;
  $("#hyg").innerHTML=h;
}

/* Ouverture : aujourd'hui, modifiable d'un geste ; « Changer les jours » pour la suite et la semaine habituelle */
let HYG=null;
function drawOuv(){if(!OUV){$("#ouvP").hidden=true;$("#ouvGo").hidden=true;return}
  const x=OUV.jour(TODAY);
  $("#ouvT").textContent=!x.midi&&!x.soir?"Fermé aujourd'hui":"Aujourd'hui";
  $("#ouvP").innerHTML=OUV.pills(x,`data-j="${TODAY}"`)+(x.ev?`<p class="ouvn">🎉 ${esc(x.ev)}</p>`:"");
  drawHyg(HYG)}
$("#ouvP").addEventListener("click",e=>{const p=e.target.closest(".opill");if(!p)return;const x=OUV.jour(TODAY);const v={midi:x.midi,soir:x.soir};v[p.dataset.s]=!v[p.dataset.s];OUV.changer(TODAY,v.midi,v.soir);drawOuv()});
$("#ouvGo").onclick=()=>OUV&&OUV.ouvrir();
document.addEventListener("2b-horaires",drawOuv);

/* Objectif du mois (mêmes règles que Chiffres) : CA de la caisse + prestations payées ; objectif tapé ou calculé
   (ce qui reste à faire sur l'année ÷ mois restants) ; avance comptée en jours (lundi = ½ journée). Positif seulement. */
const SERVW=d=>[0,.5,1,1,1,1,0][d];
const ymk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const eur0=x=>nf0.format(Math.round(x))+" €";
function drawGoal(g){const el=$("#goal");if(!g||!g.obj){el.hidden=true;return}el.hidden=false;
  const pc=g.done/g.obj,ok=pc>=1;el.classList.toggle("win",ok);
  const html=`<div class="row"><span>🎯 Objectif ${/^[aeiou]/.test(g.mois)?"d'":"de "}${esc(g.mois)}</span><em class="num">${Math.floor(pc*100)} %</em></div>
    <div class="row"><b class="num">${eur0(g.done)}</b><span>/ ${eur0(g.obj)}</span></div>
    <div class="bar" role="progressbar" aria-label="Objectif du mois" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.round(pc*100))}"><i style="--w:${Math.min(100,pc*100)}%"></i></div>
    ${ok?`<p>🏆 Objectif atteint ! Bravo l'équipe</p>`:g.diff>=50?`<p>✅ ${eur0(g.diff)} d'avance sur le rythme, bravo !</p>`:`<p class="n">Le détail dans Chiffres ›</p>`}`;
  if(el.dataset.h===html)return;const first=!el.dataset.h;if(!first)el.classList.add("still");el.dataset.h=html;el.innerHTML=html;
  if(first&&window.countUp)countUp(el.querySelector(".row b"),g.done,eur0)}   // la barre ne s'anime qu'au premier affichage
async function loadGoal(){
  const y=now.getFullYear(),m=now.getMonth(),mk=ymk(now),first=mk+"-01";
  const [o,d,ev]=await Promise.all([rpc("objectifs_liste"),rpc("suivi_mois",{p_mois:first}),rpc("evenements_liste",{p_debut:first,p_fin:TODAY}).catch(()=>[])]);
  if(!o||!+o.annuel){cache("accueil2b-goal",null);drawGoal(null);return}
  let done=0;Object.values(d||{}).forEach(r=>{const c=jca(r);if(c!=null)done+=c});
  (ev||[]).forEach(e=>{if((e.type==="privatisation"||e.type==="traiteur")&&e.statut!=="annule"&&e.budget!=null&&e.jour<=TODAY)done+=+e.budget});
  if(o["ca:"+mk]!=null)done=+o["ca:"+mk];
  const y0=m>=6?y:y-1;let before=0,left=0;
  // Mois passés : même calcul serveur que Chiffres (caisse + prestations payées) ; un chiffre tapé dans ✏️ passe avant
  const p0=ymk(new Date(y0,6,1)),pm=ymk(new Date(y,m-1,1));
  const L=p0<=pm?await rpc("ca_mois_liste",{p_du:p0+"-01",p_au:pm+"-01"}).catch(()=>({})):{};
  for(let i=0;i<12;i++){const k=ymk(new Date(y0,6+i,1));if(k>=mk){left++;continue}
    before+=o["ca:"+k]!=null?+o["ca:"+k]:(+(L||{})[k]||0)}
  const obj=o["obj:"+mk]!=null?+o["obj:"+mk]:Math.max(0,Math.round((+o.annuel-before)/Math.max(1,left)/100)*100);
  const n=new Date(y,m+1,0).getDate();let tot=0,gone=0;
  for(let dd=1;dd<=n;dd++){const w=SERVW(new Date(y,m,dd).getDay());tot+=w;if(dd<now.getDate())gone+=w}
  if(jca((d||{})[TODAY])!=null)gone+=SERVW(now.getDay());
  const g={mk,mois:now.toLocaleDateString("fr-FR",{month:"long"}),done,obj,diff:tot?done-obj*gone/tot:0};
  cache("accueil2b-goal",g);drawGoal(g);
}

/* Affichage immédiat avec les dernières valeurs connues, puis mise à jour */
const MK=`${Y.getFullYear()}-${pad(Y.getMonth()+1)}-01`;
drawEv(cache("accueil2b-ev-"+TODAY));
HYG=cache("hyg2b-cache");drawOuv();
drawCmd(cache("commande2b-cache"));
{const g=cache("accueil2b-goal");if(g&&g.mk===ymk(now))drawGoal(g)}
drawHier(cache("chiffres2b-cache-"+MK)&&cache("chiffres2b-cache-"+MK).d);
async function load(){
  const [ev,et,mo,hy]=await Promise.allSettled([rpc("evenements_liste",{p_debut:TODAY,p_fin:TOMORROW}),rpc("etat"),rpc("suivi_mois",{p_mois:MK}),rpc("hyg_etat",{p_debut:TODAY,p_fin:TODAY})]);
  for(const x of [ev,et,mo,hy])if(x.status==="rejected"&&lost(x.reason))return;
  if(hy.status==="fulfilled"){HYG=hy.value;drawHyg(HYG)}
  if(OUV)OUV.load();
  if(ev.status==="fulfilled"){cache("accueil2b-ev-"+TODAY,ev.value);drawEv(ev.value)}
  if(et.status==="fulfilled"&&et.value){cache("commande2b-cache",et.value);drawCmd(et.value)}
  if(mo.status==="fulfilled"){drawHier(mo.value)}
  loadGoal().catch(e=>{lost(e)});
  if(ev.status==="rejected"&&!cache("accueil2b-ev-"+TODAY))$("#evs").innerHTML=`<div class="empty">Pas de connexion pour l'instant.</div>`;
}
load();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
