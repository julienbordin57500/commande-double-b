<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360">
  <!-- Logo complet Double B : icône + nom + les trois piliers de l'appli -->
  <defs><clipPath id="arrondi"><rect x="20" y="20" width="320" height="320" rx="72"/></clipPath></defs>
  <g clip-path="url(#arrondi)"><g transform="translate(20 20) scale(0.625)">
  <!-- Icône Double B : un « double burger » (deux steaks = Double B), formes simples lisibles en petit -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2722"/><stop offset="1" stop-color="#13100d"/></linearGradient>
    <linearGradient id="pain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc54d"/><stop offset="1" stop-color="#ee9812"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".52" r=".5"><stop offset="0" stop-color="#f2a516" stop-opacity=".22"/><stop offset="1" stop-color="#f2a516" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fond)"/>
  <rect width="512" height="512" fill="url(#halo)"/>
  <!-- pain du dessus -->
  <path d="M116 226C116 152 180 106 256 106C332 106 396 152 396 226C396 237 388 244 377 244H135C124 244 116 237 116 226Z" fill="url(#pain)"/>
  <g fill="#fff4dc">
    <ellipse cx="200" cy="158" rx="10" ry="5.5" transform="rotate(-24 200 158)"/>
    <ellipse cx="256" cy="140" rx="10" ry="5.5"/>
    <ellipse cx="312" cy="158" rx="10" ry="5.5" transform="rotate(24 312 158)"/>
    <ellipse cx="228" cy="190" rx="10" ry="5.5" transform="rotate(-12 228 190)"/>
    <ellipse cx="286" cy="190" rx="10" ry="5.5" transform="rotate(12 286 190)"/>
  </g>
  <!-- steak 1 -->
  <rect x="106" y="254" width="300" height="46" rx="23" fill="#7a4120"/>
  <!-- steak 2 -->
  <rect x="106" y="310" width="300" height="46" rx="23" fill="#7a4120"/>
  <!-- fromage qui coule -->
  <path d="M112 298H400L384 318L364 306L338 334L314 306L272 322L248 306L214 330L190 306L156 320L136 306Z" fill="#ffd54a"/>
  <!-- pain du dessous -->
  <path d="M120 366H392C392 394 371 412 342 412H170C141 412 120 394 120 366Z" fill="url(#pain)"/>
</g></g>
  <text x="386" y="200" font-family="Bricolage Grotesque, Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="150" letter-spacing="-3" fill="#1d1b17">Double <tspan fill="#f2a516">B</tspan></text>
  <text x="392" y="272" font-family="Figtree, Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="8" fill="#1d1b17">COMMANDE <tspan fill="#f2a516">·</tspan> DEVIS <tspan fill="#f2a516">·</tspan> ANALYSE</text>
</svg>
