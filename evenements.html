<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Changement d'onglet : sens de la transition (gauche / droite) ; retour en arrière ou lien interne : pas d'effet */
addEventListener("pagereveal",e=>{if(!e.viewTransition)return;let d=null;try{d=sessionStorage.getItem("2b-sens");sessionStorage.removeItem("2b-sens")}catch(x){}
if(d)try{e.viewTransition.types.add(d)}catch(x){}else e.viewTransition.skipTransition()});</script>
<title>Événements Double B</title>
<meta name="description" content="Privatisations et prestations traiteur du Double B : fiches clients et calendrier partagé.">
<meta name="theme-color" content="#f2a516">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commande 2B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" media="print" onload="this.media=\'all\'">
<style>
/* Layout : en-tête commun ; bouton « Nouvel événement », calendrier du mois, détail du jour choisi, prochains événements. */
:root{
  --bg:#f4f2ec; --surface:#ffffff; --sunken:#f9f7f2; --line:#e6e1d5; --fg:#1d1b17; --muted:#6f695d;
  --accent:#f2a516; --accent-ink:#2a1d00; --accent-soft:#fdf1d6; --go:#2f7d4f; --danger:#c23a2b;
  --priv:#c2410c; --priv-soft:#fde4d3; --trait:#2f5d9e; --trait-soft:#e2ebf8; --note:#2f7d4f; --note-soft:#dff1e6; --theme:#7c3aed; --theme-soft:#ede4fb;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141310; --surface:#1f1d18; --sunken:#191814; --line:#34312a; --fg:#f3efe5; --muted:#a69f90;
  --accent:#f5b232; --accent-ink:#231800; --accent-soft:#3a2e12; --go:#4fae78; --danger:#e8705f;
  --priv:#fb923c; --priv-soft:#3b2414; --trait:#8db7ee; --trait-soft:#1b2a40; --note:#5fbf86; --note-soft:#16301f; --theme:#c4a5f5; --theme-soft:#2a1f3d; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 60px}
h1,h2,h3{font-family:var(--display);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:680px;margin:0 auto 14px}
.apps a{min-height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;text-align:center;line-height:1.1;padding:2px}
.apps a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
header.top{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:112px;height:62px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:6px 10px}
.logo img{width:100%;height:auto;display:block}
.titles{flex:1;min-width:0}
.titles h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
.titles p{margin:6px 0 0;font-size:15px;color:var(--muted);font-weight:500}
.sync{font-size:12px;color:var(--muted);text-align:right;margin-bottom:6px}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.ok::before{background:var(--go)} .sync.err::before{background:var(--danger)}

.btn{height:52px;border-radius:14px;border:0;padding:0 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px}
.btn.soft{background:var(--sunken);border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.55}
.new{width:100%;height:62px;font-size:18px;margin-top:16px;border-radius:16px}
.new span{font-size:24px;line-height:1}

/* Calendrier */
.cal{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px}
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{flex:1;text-align:center;font-size:22px;font-weight:800;text-transform:capitalize}
.arrow{width:48px;height:48px;border-radius:13px;border:0;background:var(--sunken);display:grid;place-items:center;color:var(--fg);flex:none}
.arrow svg{width:22px;height:22px}
.todayb{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--sunken);padding:0 10px;font-size:13px;font-weight:700;display:block;margin:6px auto 0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-top:10px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.day{position:relative;min-height:62px;border-radius:12px;border:1.5px solid transparent;background:var(--sunken);padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:15px;min-width:0}
.day.out{opacity:.35}
.day.today .n{background:var(--fg);color:var(--bg);border-radius:8px;padding:0 6px}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day .tags{display:flex;flex-direction:column;gap:2px;width:100%}
.day .t{display:block;height:7px;border-radius:4px;width:100%;overflow:hidden;font-size:0;color:transparent;line-height:0}
.day .t.privatisation{background:var(--priv)} .day .t.traiteur{background:var(--trait)} .day .t.note{background:var(--note)} .day .t.theme{background:var(--theme)}
.day .t.option{opacity:.45}
.day .more{font-size:10px;font-weight:800;color:var(--muted);line-height:1}
@media (min-width:560px){.day{min-height:78px}.day .t{height:auto;line-height:1.3;font-size:11px;font-weight:700;color:#fff;padding:1px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}

/* Jour choisi et liste */
.panel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.panel .ph{display:flex;align-items:center;gap:8px}
.panel .ph h3{flex:1;text-align:center;font-size:19px;font-weight:800}
.panel .ph h3 small{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ev{display:flex;gap:12px;align-items:stretch;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--sunken);text-align:left;width:100%}
.ev .bar{flex:none;width:6px;border-radius:3px}
.ev.privatisation .bar{background:var(--priv)} .ev.traiteur .bar{background:var(--trait)} .ev.note .bar{background:var(--note)} .ev.theme .bar{background:var(--theme)}
.ev.note b{font-size:16px;font-weight:700;white-space:normal}
.ev .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ev .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev b{font-size:18px;font-weight:800}
.ty{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:7px;padding:2px 7px}
.ty.privatisation{color:var(--priv);background:var(--priv-soft)} .ty.traiteur{color:var(--trait);background:var(--trait-soft)} .ty.theme{color:var(--theme);background:var(--theme-soft)}
.st{font-size:12px;font-weight:800;border-radius:7px;padding:2px 7px}
.st.option{background:var(--accent-soft);color:var(--fg)} .st.confirme{background:var(--go);color:#fff} .st.annule{background:var(--line);color:var(--muted);text-decoration:line-through}
.ev .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);font-weight:600}
.ev .meta span{white-space:nowrap}
.ev .meta .nc{color:var(--danger);font-weight:800} .ev .meta .ok{color:var(--go);font-weight:800}
.ev .who{font-size:12px;color:var(--muted)}
.ev .date{font-size:13px;font-weight:800;color:var(--fg)}
.empty{color:var(--muted);text-align:center;padding:16px 8px;font-size:15px}
.addday{width:100%;margin-top:12px}
.dayacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dayacts .btn{height:56px;font-size:15px;padding:0 8px}
.sheet .ph{display:flex;align-items:center;gap:8px}
.sheet .ph h3{flex:1;text-align:center;font-size:20px}
.sheet .ph h3 small{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.hint{margin:4px 0 0;color:var(--muted);font-size:14px}
.nform{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.nform textarea{min-height:64px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunken);padding:10px 12px;width:100%;font-size:17px;resize:vertical}
.nform input{height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunken);padding:0 12px;width:100%;font-size:16px}
.nform label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;gap:4px;min-width:0}

/* Fiche client */
.sheet{position:fixed;inset:0;background:rgba(10,8,4,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet h3{font-size:22px;font-weight:800}
.sheet .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field label em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600}
.field input,.field textarea,.nform input,.nform textarea{min-width:0;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:54px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.field input,.field textarea{height:54px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunken);padding:0 12px;width:100%;font-size:17px}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.field .in{position:relative}
.field .in span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;color:var(--muted);padding:4px;line-height:1.15}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.seg button .e{display:block;font-size:20px}
.warn{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.acts{display:grid;gap:8px}
.acts .btn{height:56px;font-size:17px}
.caisse{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--sunken);cursor:pointer;font-weight:800;font-size:16px}
.caisse input{width:28px;height:28px;flex:none;accent-color:var(--go);margin:0}
.caisse small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.caisse:has(input:checked){border-color:var(--go);background:color-mix(in srgb,var(--go) 12%,var(--surface))}
.call{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;background:var(--go);color:#fff;font-weight:800;text-decoration:none;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:400px){.titles h1{font-size:25px}header.top .logo{width:92px;height:54px}.apps a{font-size:12px}.calhead h2{font-size:19px}.day{font-size:14px}}

/* Passage d'un onglet à l'autre : fondu court, la barre du haut ne bouge pas */
@view-transition{navigation:auto}
.pbar{view-transition-name:pbar}.apps{view-transition-name:apps}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.logo img{aspect-ratio:1000/403}
</style>
</head>
<body>
<div class="wrap">
  <div class="pbar" id="pbar"></div><script src="profil.js"></script>
  <div class="sync" id="sync">Connexion…</div>
  <header class="top">
    <div class="logo"><img src="logo-hd.png" alt="Double B" width="1000" height="403"></div>
    <div class="titles"><h1>Événements</h1><p>Privatisations, traiteur et soirées à thème, visibles par toute l'équipe.</p></div>
  </header>

  <button class="btn new" id="newBtn" type="button"><span>＋</span> Nouvel événement</button>

  <section class="cal" aria-label="Calendrier">
    <div class="calhead">
      <button class="arrow" id="mPrev" aria-label="Mois précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2 id="mName">&nbsp;</h2>
      <button class="arrow" id="mNext" aria-label="Mois suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <button class="todayb" id="today" type="button">Revenir à aujourd'hui</button>
    <div class="dow"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i style="background:var(--priv)"></i>Privatisation</span><span><i style="background:var(--trait)"></i>Traiteur</span><span><i style="background:var(--theme)"></i>Soirée à thème</span><span><i style="background:var(--note)"></i>Note</span><span><i style="background:var(--muted);opacity:.45"></i>Pâle = en option</span></div>
  </section>

  <section class="panel" aria-label="Prochains événements">
    <h3 style="font-size:19px;font-weight:800">À venir</h3>
    <div class="list" id="upList"></div>
  </section>

  <section class="panel" aria-label="Pense-bête">
    <h3 style="font-size:19px;font-weight:800">📌 Pense-bête</h3>
    <p class="hint">Une info pour un jour précis : penser à une commande, un commercial qui passe, une livraison…</p>
    <div class="nform">
      <textarea id="nText" maxlength="300" placeholder="ex. Le commercial Sysco passe à 10 h"></textarea>
      <div class="row2"><label>Jour<input id="nJour" type="date"></label><label>Heure (facult.)<input id="nHeure" type="time"></label></div>
      <button class="btn" id="nAdd" type="button">Ajouter la note</button>
    </div>
    <div class="list" id="noteList"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Connexion : même base et même code d'équipe que le reste de l'appli */
const API="https://kokjumjhpasxxxrpspng.supabase.co/rest/v1/rpc/";
const KEY="sb_publishable_HIJXH1eJ_CP-A4G3AecDKg_NbBUD0m2";
const CK="commande2b-code";
let CODE=null;try{CODE=localStorage.getItem(CK)}catch{}
if(!CODE)location.replace("./");

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
async function rpc(fn,args={}){
  const r=await fetch(API+fn,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({p_code:CODE,...args})});
  if(!r.ok){let e={};try{e=await r.json()}catch{}const err=new Error(e.message||"Erreur réseau");err.code=e.code;throw err}
  const t=await r.text();return t?JSON.parse(t):null;
}
function setSync(t,cls){const s=$("#sync");s.textContent=t;s.className="sync"+(cls?" "+cls:"")}
function lost(e){if(e&&e.code==="28000"){try{localStorage.removeItem(CK)}catch{}location.replace("./");return true}return false}

/* ---------- Dates (heure locale) ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const longDay=d=>cap(d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
const shortDay=d=>cap(d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}));
const now=new Date();const TODAY=iso(now);
const S={y:now.getFullYear(),m:now.getMonth(),sel:TODAY,evs:[],up:[]};

/* ---------- Libellés ---------- */
const TYPES={privatisation:{l:"Privatisation",e:"🏠"},traiteur:{l:"Traiteur",e:"🚚"},theme:{l:"Soirée à thème",e:"🎉"},note:{l:"Note",e:"📌"}};
const PAYE=e=>e.type==="privatisation"||e.type==="traiteur";   // prestations payées à part : prix + case « Entré en caisse »
const STATUTS={option:"En option",confirme:"Confirmé",annule:"Annulé"};
const eur=v=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(v)+" €";
const who=()=>{try{return localStorage.getItem("2b-profil")||""}catch{return ""}};
const NOMS={julien:"Julien",eric:"Eric",thierry:"Thierry",claire:"Claire"};

/* ---------- Chargement ----------
   On charge les 6 semaines visibles du calendrier + les 4 prochains mois pour « À venir ». */
function range(){const first=new Date(S.y,S.m,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));const end=new Date(start);end.setDate(start.getDate()+41);return [start,end]}
async function load(){
  const [a,b]=range();const upEnd=new Date(now);upEnd.setMonth(upEnd.getMonth()+6);const ck="evenements2b-cache-"+iso(a);
  if(!S.evs.length){try{const c=JSON.parse(localStorage.getItem(ck)||"null");if(c){S.evs=c.e;S.up=c.u;render()}}catch{}}
  try{
    const [evs,up]=await Promise.all([rpc("evenements_liste",{p_debut:iso(a),p_fin:iso(b)}),rpc("evenements_liste",{p_debut:TODAY,p_fin:iso(upEnd)})]);
    S.evs=evs||[];S.up=(up||[]).filter(e=>e.statut!=="annule");try{localStorage.setItem(ck,JSON.stringify({e:S.evs,u:S.up}))}catch{}setSync("À jour","ok");render();refreshDay();
  }catch(e){if(lost(e))return;setSync("Hors ligne","err");render()}
}
setInterval(()=>{if(document.visibilityState==="visible"&&!document.querySelector(".sheet"))load()},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});

/* ---------- Affichage ---------- */
const byDay=d=>S.evs.filter(e=>e.jour===d);
function render(){
  $("#mName").textContent=new Date(S.y,S.m,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const [a]=range();let html="";
  for(let i=0;i<42;i++){const d=new Date(a);d.setDate(a.getDate()+i);const k=iso(d);const evs=byDay(k).filter(e=>e.statut!=="annule");
    const cls=["day",d.getMonth()!==S.m?"out":"",k===TODAY?"today":"",k===S.sel?"sel":""].join(" ");
    const tags=evs.slice(0,2).map(e=>`<span class="t ${e.type} ${e.statut==="option"?"option":""}">${esc(e.client)}</span>`).join("");
    html+=`<button class="${cls}" data-d="${k}" aria-label="${esc(longDay(d))}${evs.length?`, ${evs.length} événement${evs.length>1?"s":""}`:""}"><span class="n">${d.getDate()}</span><span class="tags">${tags}</span>${evs.length>2?`<span class="more">+${evs.length-2}</span>`:""}</button>`}
  $("#grid").innerHTML=html;
  const evs=S.up.filter(e=>e.type!=="note"),notes=S.up.filter(e=>e.type==="note");
  $("#upList").innerHTML=evs.length?evs.slice(0,8).map(e=>card(e,true)).join(""):`<div class="empty">Aucune privatisation ni prestation à venir.</div>`;
  $("#noteList").innerHTML=notes.length?notes.slice(0,12).map(e=>card(e,true)).join(""):"";
}
function card(e,withDate){
  const t=TYPES[e.type]||TYPES.privatisation;const meta=[];
  if(e.type==="note")return `<button class="ev note" data-ev="${e.id}"><span class="bar"></span><span class="body">
    ${withDate?`<span class="date">${esc(shortDay(parse(e.jour)))}${e.heure?" · "+esc(e.heure):""}</span>`:e.heure?`<span class="date">🕒 ${esc(e.heure)}</span>`:""}
    <b>📌 ${esc(e.client)}</b>${e.cree_par?`<span class="who">Noté par ${esc(NOMS[e.cree_par]||e.cree_par)}</span>`:""}</span></button>`;
  if(e.heure)meta.push(`🕒 ${esc(e.heure)}`);
  if(e.personnes!=null)meta.push(`👥 ${e.personnes} pers.`);
  if(e.budget!=null)meta.push(`💶 ${eur(+e.budget)}`);
  if(e.acompte!=null)meta.push(`✅ Acompte ${eur(+e.acompte)}`);
  if(PAYE(e)&&e.statut!=="annule")meta.push(e.en_caisse?`<span class="ok">💰 En caisse</span>`:e.jour<=TODAY?`<span class="nc">⚠️ Pas encore en caisse</span>`:"");
  if(e.type==="traiteur"&&e.lieu)meta.push(`📍 ${esc(e.lieu)}`);
  if(e.telephone)meta.push(`📞 ${esc(e.telephone)}`);
  return `<button class="ev ${e.type}" data-ev="${e.id}"><span class="bar"></span><span class="body">
    ${withDate?`<span class="date">${esc(shortDay(parse(e.jour)))}</span>`:""}
    <span class="top"><b>${esc(e.client)}</b><span class="ty ${e.type}">${t.e} ${t.l}</span><span class="st ${e.statut}">${STATUTS[e.statut]||""}</span></span>
    ${meta.filter(Boolean).length?`<span class="meta">${meta.filter(Boolean).map(m=>`<span>${m}</span>`).join("")}</span>`:""}
    ${e.notes?`<span class="meta" style="white-space:normal">📝 ${esc(e.notes.length>90?e.notes.slice(0,90)+"…":e.notes)}</span>`:""}
    ${e.cree_par?`<span class="who">Ajouté par ${esc(NOMS[e.cree_par]||e.cree_par)}</span>`:""}</span></button>`;
}

/* ---------- Navigation ---------- */
function goMonth(delta){const d=new Date(S.y,S.m+delta,1);S.y=d.getFullYear();S.m=d.getMonth();
  S.sel=(S.y===now.getFullYear()&&S.m===now.getMonth())?TODAY:iso(d);render();load()}
$("#mPrev").onclick=()=>goMonth(-1);$("#mNext").onclick=()=>goMonth(1);
$("#today").onclick=()=>{S.y=now.getFullYear();S.m=now.getMonth();S.sel=TODAY;render();load()};
$("#grid").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;openDay(b.dataset.d)});
document.addEventListener("click",e=>{const c=e.target.closest("[data-ev]");if(!c)return;const ev=[...S.evs,...S.up].find(x=>x.id===c.dataset.ev);if(!ev)return;
  const dm=document.querySelector(".sheet.daysheet");if(dm)dm.remove();ev.type==="note"?openNote(ev):openForm(ev)});
$("#newBtn").onclick=()=>openForm(null,S.sel<TODAY?TODAY:S.sel);

/* Fenêtre du jour : ce qui est prévu, avec ajout direct */
let DAY=null;
function openDay(k){
  const d=parse(k);S.sel=k;if(d.getMonth()!==S.m||d.getFullYear()!==S.y){S.y=d.getFullYear();S.m=d.getMonth();load()}render();
  let m=document.querySelector(".sheet.daysheet");
  if(!m){m=document.createElement("div");m.className="sheet daysheet";document.body.appendChild(m);
    m.addEventListener("click",e=>{if(e.target===m){m.remove();DAY=null}})}
  DAY=k;
  const list=byDay(k);
  m.innerHTML=`<div class="box" role="dialog" aria-label="${esc(longDay(d))}">
    <div class="ph"><button class="arrow" data-dd="-1" aria-label="Jour précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h3>${esc(longDay(d))}<small>${k===TODAY?"Aujourd'hui":"&nbsp;"}</small></h3>
      <button class="arrow" data-dd="1" aria-label="Jour suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="list" style="margin-top:0">${list.length?list.map(e=>card(e,false)).join(""):`<div class="empty">Rien de prévu ce jour-là.</div>`}</div>
    <div class="dayacts"><button class="btn" type="button" data-add="ev">＋ Événement</button><button class="btn soft" type="button" data-add="note">📌 Note</button></div>
    <button class="btn soft" type="button" data-close>Fermer</button></div>`;
  m.querySelectorAll("[data-dd]").forEach(b=>b.onclick=()=>{const x=parse(DAY);x.setDate(x.getDate()+(+b.dataset.dd));openDay(iso(x))});
  m.querySelector("[data-close]").onclick=()=>{m.remove();DAY=null};
  m.querySelector('[data-add="ev"]').onclick=()=>{m.remove();DAY=null;openForm(null,k)};
  m.querySelector('[data-add="note"]').onclick=()=>{m.remove();DAY=null;openNote(null,k)};
}
function refreshDay(){if(DAY&&document.querySelector(".sheet.daysheet")&&document.querySelectorAll(".sheet").length===1)openDay(DAY)}

/* Pense-bête : une note rattachée à un jour */
async function saveNote(id,champs){
  try{await rpc("evenement_enregistrer",{p_id:id,p_champs:{...champs,par:who()}});await load();return true}
  catch(err){if(!lost(err))toast("Pas enregistré : vérifie la connexion");return false}
}
$("#nJour").value=TODAY;
$("#nAdd").onclick=async()=>{
  const t=$("#nText").value.trim(),j=$("#nJour").value;if(!t){toast("Écris la note");$("#nText").focus();return}if(!j){toast("Choisis le jour");return}
  $("#nAdd").disabled=true;
  if(await saveNote(null,{type:"note",client:t,jour:j,heure:$("#nHeure").value,cree_par:who()})){$("#nText").value="";$("#nHeure").value="";toast("Note ajoutée ✓")}
  $("#nAdd").disabled=false;
};
function openNote(ev,day){
  const isNew=!ev;const e=ev||{jour:day||TODAY};
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="Note"><h3>📌 ${isNew?"Nouvelle note":"Note"}</h3>
    ${!isNew&&e.cree_par?`<div class="sub">Notée par ${esc(NOMS[e.cree_par]||e.cree_par)}</div>`:""}
    <div class="nform" style="margin-top:0"><textarea id="oText" maxlength="300" placeholder="ex. Penser à commander les fûts">${esc(e.client||"")}</textarea>
    <div class="row2"><label>Jour<input id="oJour" type="date" value="${esc(e.jour)}"></label><label>Heure (facult.)<input id="oHeure" type="time" value="${esc(e.heure||"")}"></label></div></div>
    <div class="acts"><button class="btn" type="button" id="oSave">${isNew?"Ajouter la note":"Enregistrer"}</button>
      ${isNew?"":`<button class="btn danger" type="button" id="oDel">Supprimer la note</button>`}
      <button class="btn soft" type="button" id="oCancel">Annuler</button></div></div>`;
  document.body.appendChild(m);const close=()=>m.remove();
  m.addEventListener("click",x=>{if(x.target===m)close()});$("#oCancel").onclick=close;
  if(isNew)setTimeout(()=>$("#oText").focus(),200);
  $("#oSave").onclick=async()=>{const t=$("#oText").value.trim(),j=$("#oJour").value;if(!t){toast("Écris la note");return}if(!j){toast("Choisis le jour");return}
    const ch={type:"note",client:t,jour:j,heure:$("#oHeure").value};if(isNew)ch.cree_par=who();
    if(await saveNote(isNew?null:e.id,ch)){close();toast(isNew?"Note ajoutée ✓":"Note enregistrée ✓")}};
  if(!isNew)$("#oDel").onclick=async()=>{
    const ok=await ask("Supprimer cette note ?",esc(e.client),[{label:"Oui, supprimer",value:true,cls:"danger"},{label:"Annuler",value:false,cls:"soft"}]);if(!ok)return;
    try{await rpc("evenement_supprimer",{p_id:e.id});close();await load();toast("Note supprimée")}catch(err){if(!lost(err))toast("Pas supprimée : vérifie la connexion")}};
}

/* ---------- Fiche client ---------- */
function ask(title,text,buttons){return new Promise(res=>{
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${text?`<div class="sub" style="margin-top:0">${text}</div>`:""}<div class="acts">${buttons.map((b,i)=>`<button class="btn ${b.cls||""}" type="button" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
  document.body.appendChild(m);const close=v=>{m.remove();res(v)};
  m.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)close(buttons[+b.dataset.i].value);else if(e.target===m)close(null)});
})}
const num=v=>{v=String(v||"").replace(/\s|€/g,"").replace(",",".");if(v==="")return "";const n=parseFloat(v);return isNaN(n)||n<0?null:n};
function openForm(ev,day){
  const isNew=!ev;const e=ev||{type:"privatisation",statut:"option",jour:day||TODAY};
  let type=e.type,statut=e.statut;
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="Fiche client">
    <h3>${isNew?"Nouvel événement":"Fiche client"}</h3>
    ${!isNew&&e.cree_par?`<div class="sub">Ajouté par ${esc(NOMS[e.cree_par]||e.cree_par)}</div>`:""}
    <div class="field"><label>Type</label><div class="seg three">
      <button type="button" data-ty="privatisation" aria-pressed="${type==="privatisation"}"><span class="e">🏠</span>Privatisation</button>
      <button type="button" data-ty="traiteur" aria-pressed="${type==="traiteur"}"><span class="e">🚚</span>Traiteur extérieur</button>
      <button type="button" data-ty="theme" aria-pressed="${type==="theme"}"><span class="e">🎉</span>Soirée à thème</button></div></div>
    <div class="field"><label for="fClient" id="fClientL">Nom du client</label><input id="fClient" maxlength="120" autocomplete="off" placeholder="ex. Mme Dupont – anniversaire" value="${esc(e.client||"")}"></div>
    <div class="hint" id="fThemeH">Le chiffre de cette soirée, c'est le CA du soir de ce jour-là : il sera compté à part dans Chiffres.</div>
    <div class="row2">
      <div class="field"><label for="fJour">Date</label><input id="fJour" type="date" value="${esc(e.jour)}"></div>
      <div class="field"><label for="fHeure">Heure <em>(facultatif)</em></label><input id="fHeure" type="time" value="${esc(e.heure||"")}"></div>
    </div>
    <div class="warn" id="fWarn" hidden></div>
    <div class="row2">
      <div class="field"><label for="fPers">Personnes <em>(facult.)</em></label><input id="fPers" inputmode="numeric" placeholder="–" value="${e.personnes??""}"></div>
      <div class="field paye"><label for="fBudget">Prix total <em>(facult.)</em></label><div class="in"><input id="fBudget" inputmode="decimal" placeholder="–" value="${e.budget!=null?String(+e.budget).replace(".",","):""}"><span>€</span></div></div>
    </div>
    <div class="field paye"><label for="fTel">Téléphone <em>(facultatif)</em></label><input id="fTel" type="tel" inputmode="tel" autocomplete="off" placeholder="ex. 06 12 34 56 78" value="${esc(e.telephone||"")}"></div>
    ${!isNew&&e.telephone&&PAYE(e)?`<a class="call" href="tel:${esc(e.telephone.replace(/[^\d+]/g,""))}">📞 Appeler ${esc(e.client)}</a>`:""}
    <div class="field" id="fLieuF"><label for="fLieu">Lieu de la prestation <em>(facultatif)</em></label><input id="fLieu" maxlength="200" placeholder="ex. Salle des fêtes de Faulquemont" value="${esc(e.lieu||"")}"></div>
    <div class="field"><label>Statut</label><div class="seg three">
      <button type="button" data-st="option" aria-pressed="${statut==="option"}"><span class="e">⏳</span>En option</button>
      <button type="button" data-st="confirme" aria-pressed="${statut==="confirme"}"><span class="e">✅</span>Confirmé</button>
      <button type="button" data-st="annule" aria-pressed="${statut==="annule"}"><span class="e">✖️</span>Annulé</button></div></div>
    <div class="field paye"><label for="fAcompte">Acompte reçu <em>(facultatif)</em></label><div class="in"><input id="fAcompte" inputmode="decimal" placeholder="–" value="${e.acompte!=null?String(+e.acompte).replace(".",","):""}"><span>€</span></div></div>
    <label class="caisse paye"><input type="checkbox" id="fCaisse"${e.en_caisse?" checked":""}><span>💰 Entré dans la caisse du restaurant<small>${e.en_caisse&&e.en_caisse_par?`Coché par ${esc(NOMS[e.en_caisse_par]||e.en_caisse_par)}${e.en_caisse_le?" le "+esc(new Date(e.en_caisse_le).toLocaleDateString("fr-FR")):""}`:"À cocher seulement quand c'est tapé dans la caisse"}</small></span></label>
    <div class="field"><label for="fNotes">Notes <em>(menu choisi, allergies, déco…)</em></label><textarea id="fNotes" maxlength="2000">${esc(e.notes||"")}</textarea></div>
    <div class="acts">
      <button class="btn" type="button" id="fSave">${isNew?"Ajouter au calendrier":"Enregistrer"}</button>
      ${isNew?"":`<button class="btn soft paye" type="button" id="fDevis">📄 Faire le devis</button>`}
      ${isNew?"":`<button class="btn danger" type="button" id="fDel">Supprimer l'événement</button>`}
      <button class="btn soft" type="button" id="fCancel">Annuler</button>
    </div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();m.addEventListener("click",x=>{if(x.target===m)close()});$("#fCancel").onclick=close;
  // Soirée à thème : pas de client à appeler ni de prix (son chiffre = le soir de ce jour-là)
  const showLieu=()=>{$("#fLieuF").hidden=type!=="traiteur";const th=type==="theme";
    m.querySelectorAll(".paye").forEach(x=>x.hidden=th);$("#fThemeH").hidden=!th;
    $("#fClientL").textContent=th?"Nom de la soirée":"Nom du client";$("#fClient").placeholder=th?"ex. Soirée grenouilles":"ex. Mme Dupont – anniversaire"};showLieu();
  m.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{type=b.dataset.ty;m.querySelectorAll("[data-ty]").forEach(x=>x.setAttribute("aria-pressed",x===b));showLieu()});
  m.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{statut=b.dataset.st;m.querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  // prévenir s'il y a déjà quelque chose ce jour-là
  async function checkDay(){
    const d=$("#fJour").value;if(!d){$("#fWarn").hidden=true;return}
    let list=S.evs.filter(x=>x.jour===d);
    if(!list.length&&(d<iso(range()[0])||d>iso(range()[1]))){try{list=await rpc("evenements_liste",{p_debut:d,p_fin:d})}catch{list=[]}}
    list=list.filter(x=>x.id!==e.id&&x.statut!=="annule"&&x.type!=="note");
    $("#fWarn").hidden=!list.length;
    $("#fWarn").innerHTML=list.length?`⚠️ Déjà prévu ce jour-là : ${list.map(x=>`<b>${esc(x.client)}</b> (${TYPES[x.type].l.toLowerCase()}${x.heure?", "+esc(x.heure):""})`).join(", ")}`:"";
  }
  $("#fJour").addEventListener("change",checkDay);checkDay();
  if(isNew)setTimeout(()=>$("#fClient").focus(),200);
  $("#fSave").onclick=async()=>{
    const client=$("#fClient").value.trim(),jour=$("#fJour").value;
    if(!client){toast(type==="theme"?"Donne un nom à la soirée":"Mets au moins le nom du client");$("#fClient").focus();return}
    if(!jour){toast("Choisis une date");$("#fJour").focus();return}
    const pers=num($("#fPers").value),budget=num($("#fBudget").value),acompte=num($("#fAcompte").value);
    if(pers===null||budget===null||acompte===null){toast("Un chiffre n'est pas valable");return}
    const th=type==="theme";
    const champs={type,client,jour,heure:$("#fHeure").value,telephone:th?"":$("#fTel").value.trim(),personnes:pers===""?"":Math.round(pers),budget:th?"":budget,acompte:th?"":acompte,
      lieu:type==="traiteur"?$("#fLieu").value.trim():"",statut,notes:$("#fNotes").value.trim(),en_caisse:!th&&$("#fCaisse").checked};
    if(isNew)champs.cree_par=who();
    $("#fSave").disabled=true;
    try{await rpc("evenement_enregistrer",{p_id:isNew?null:e.id,p_champs:{...champs,par:who()}});close();
      const d=parse(jour);S.sel=jour;S.y=d.getFullYear();S.m=d.getMonth();await load();
      toast(isNew?"Ajouté au calendrier ✓":"Fiche enregistrée ✓")}
    catch(err){if(lost(err))return;toast("Pas enregistré : vérifie la connexion");$("#fSave").disabled=false}
  };
  if(!isNew)$("#fDevis").onclick=()=>{
    const t=type==="traiteur"?"Prestation traiteur":"Privatisation de la salle";
    const adr=[$("#fTel").value.trim(),type==="traiteur"&&$("#fLieu").value.trim()?"Lieu : "+$("#fLieu").value.trim():""].filter(Boolean).join("\n");
    try{localStorage.setItem("devis2b-prefill",JSON.stringify({client:$("#fClient").value.trim(),adr,objet:t,jour:$("#fJour").value,pers:$("#fPers").value.trim()}))}catch{}
    location.href="menus.html#devis";
  };
  if(!isNew)$("#fDel").onclick=async()=>{
    const ok=await ask("Supprimer cet événement ?",`<b>${esc(e.client)}</b> le ${esc(longDay(parse(e.jour)))}. Si c'est juste annulé, choisis plutôt le statut « Annulé ».`,[{label:"Oui, supprimer",value:true,cls:"danger"},{label:"Annuler",value:false,cls:"soft"}]);
    if(!ok)return;
    try{await rpc("evenement_supprimer",{p_id:e.id});close();await load();toast("Événement supprimé")}catch(err){if(!lost(err))toast("Pas supprimé : vérifie la connexion")}
  };
}

/* Ouverture directe depuis une notification : evenements.html#ev=<id>&j=<jour> */
async function openFromHash(){
  const H=new URLSearchParams(location.hash.slice(1));const id=H.get("ev"),j=H.get("j");if(!id&&!j)return;
  history.replaceState(null,"",location.pathname+location.search);
  document.querySelectorAll(".sheet").forEach(x=>x.remove());
  if(j&&/^\d{4}-\d{2}-\d{2}$/.test(j)){const d=parse(j);if(d.getMonth()!==S.m||d.getFullYear()!==S.y){S.y=d.getFullYear();S.m=d.getMonth();S.sel=j;render();await load()}}
  let ev=[...S.evs,...S.up].find(x=>x.id===id);
  if(!ev&&id&&j){try{ev=(await rpc("evenements_liste",{p_debut:j,p_fin:j})||[]).find(x=>x.id===id)}catch{}}
  if(ev){ev.type==="note"?openNote(ev):openForm(ev)}else if(j){openDay(j);toast("Cet événement a été supprimé ou déplacé")}
}
addEventListener("hashchange",openFromHash);
{const H=new URLSearchParams(location.hash.slice(1)).get("j");if(H&&/^\d{4}-\d{2}-\d{2}$/.test(H)){const d=parse(H);S.y=d.getFullYear();S.m=d.getMonth();S.sel=H}}
render();load().then(openFromHash);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
