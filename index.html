<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commande Double B</title>
<meta name="description" content="Listes de commande des matières premières du Double B.">
<meta name="theme-color" content="#f2a516">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commande 2B">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{if(localStorage.getItem("commande2b-code")){document.documentElement.classList.add("has-code");
  /* À l'ouverture de l'appli, on commence par l'écran « Aujourd'hui » */
  if(!sessionStorage.getItem("2b-s")&&!location.hash){sessionStorage.setItem("2b-s","1");location.replace("accueil.html")}}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media=\'all\'">
<style>
/* Layout : en-tête logo + « Commande » + date, recherche, onglets, cartes repliables par fournisseur, ajout en bas. */
:root{
  --bg:#f4f2ec; --surface:#ffffff; --sunken:#f9f7f2; --line:#e6e1d5; --fg:#1d1b17; --muted:#6f695d;
  --accent:#f2a516; --accent-ink:#2a1d00; --accent-soft:#fdf1d6; --go:#2f7d4f; --go-ink:#ffffff; --danger:#c23a2b;
  --c-mar:#3f8a4f; --c-mar-soft:#e3f2e6; --c-sys:#1f5fa8; --c-sys-soft:#e1ecf8; --c-cdp:#b5651d; --c-cdp-soft:#f8eadb;
  --c-oth:#6d5a9e; --c-oth-soft:#ece7f6;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141310; --surface:#1f1d18; --sunken:#191814; --line:#34312a; --fg:#f3efe5; --muted:#a69f90;
  --accent:#f5b232; --accent-ink:#231800; --accent-soft:#3a2e12; --go:#4fae78; --go-ink:#0d1f14; --danger:#e8705f;
  --c-mar:#7cc78c; --c-mar-soft:#1e3324; --c-sys:#7fb3ea; --c-sys-soft:#182a40; --c-cdp:#e3a066; --c-cdp-soft:#3a2716;
  --c-oth:#b9a6e6; --c-oth-soft:#2a2440; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
html.has-code #app{display:block!important}html.has-code #gate{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 60px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Écran de code */
.gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.gate .logo{width:180px;height:auto;padding:14px 18px}
.gate h1{font-size:28px}
.gate p{color:var(--muted);margin:0;max-width:320px}
.gate form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.gate input{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:20px;letter-spacing:.06em;font-weight:700}
.gate .err{color:var(--danger);font-weight:600;font-size:15px}

/* Bascule entre les deux parties de l'appli */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.apps a{min-height:42px;padding:2px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;text-align:center;line-height:1.1}
.apps a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* En-tête */
header.top{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:112px;height:62px;border-radius:16px;background:#ffffff;border:1px solid var(--line);display:grid;place-items:center;padding:6px 10px}
.logo img{width:100%;height:auto;display:block}
.titles{flex:1;min-width:0}
.titles h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
.titles .date{margin-top:6px;font-size:15px;color:var(--muted);font-weight:500}
.titles .date b{color:var(--fg);font-weight:700}
.sync{font-size:12px;color:var(--muted);text-align:right;margin-bottom:6px}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.ok::before{background:var(--go)} .sync.err::before{background:var(--danger)}

/* Recherche */
.search{position:relative;margin-top:16px}
.search svg{position:absolute;left:16px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 52px 0 50px;font-size:17px;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.search input::-webkit-search-cancel-button{display:none}
.search button{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:12px;border:0;background:var(--sunken);font-size:22px;line-height:1;color:var(--muted)}
.qinfo{margin:10px 4px 0;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qinfo .btn{height:40px;font-size:14px;padding:0 14px}
mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 1px}
/* Résultats de recherche : liste compacte juste sous la barre, visible au-dessus du clavier */
.qres{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.qr{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-top:1px solid var(--line);min-height:62px;position:relative}
.qr:first-child{border-top:0}
.qr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.qr.on{background:var(--accent-soft)}.qr.on::before{background:var(--accent)}
.qr-t{flex:1;min-width:0}
.qr-t b{display:block;font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.qr-t small{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr-t small i{font-style:normal;font-weight:700;color:var(--fg)}
.qr-t{cursor:pointer;border-radius:10px;margin:-4px 0 -4px -6px;padding:4px 0 4px 6px}
.qr-t:active{background:var(--sunken)}
.qr-t .qp{font-weight:700;color:var(--fg)}
.qr-t .badge-promo{font-size:10px;vertical-align:1px}
.qgo{color:var(--muted);font-weight:800}
/* Fiche détail ouverte depuis la recherche */
.fcmd{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--sunken)}
.fcmd span{flex:1;font-weight:700}
.fcmd .fct{height:50px;padding:0 20px;flex:none}
.ailleurs{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ailleurs h4{margin:0;padding:10px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ailleurs div{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.ailleurs div span{flex:1}
.qr .qty{width:64px;height:46px;flex:none}
.qr.on{flex-wrap:wrap}
.qr-c{display:flex;align-items:center;gap:8px;width:100%;padding-bottom:2px}
.qr-c .unit{flex:1;min-width:0;max-width:none;height:46px;font-size:16px}
.qr .toggle{height:48px;padding:0 14px 0 10px}
.qr .toggle[aria-pressed="true"]{width:48px;padding:0;justify-content:center}
.qr-more{padding:12px 14px;font-size:14px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}

/* Onglets */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:14px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.tabs button{height:50px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.badge{min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;display:inline-grid;place-items:center;padding:0 7px;font-variant-numeric:tabular-nums}

/* Cartes fournisseur */
.suppliers{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.sup{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.sup-head{width:100%;display:flex;align-items:center;gap:14px;padding:14px;background:none;border:0;text-align:left}
.ico{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--soft);color:var(--c)}
.ico svg{width:32px;height:32px}
.sup-name{flex:1;min-width:0}
.sup-name h2{font-size:21px;font-weight:800;line-height:1.1}
.sup-name small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.count{flex:none;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.chev{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:transform .2s ease}
.sup[data-open="true"] .chev{transform:rotate(90deg)}
.sup-body{border-top:1px solid var(--line)}
.sup[data-open="false"] .sup-body{display:none}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 10px 10px 16px;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.item.on{background:var(--accent-soft)}
.item.on::before{background:var(--accent)}
.item .name{flex:1 1 170px;min-width:0;font-weight:600;font-size:16px;padding-block:4px}
.item .name em{font-style:normal;font-weight:400;color:var(--muted);font-size:14px}
.ctrls{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin-left:auto}
.qty{width:70px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px}
.qty::placeholder{color:var(--muted);font-weight:500}
.unit{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 6px;font-size:15px;max-width:96px}
.toggle{flex:none;height:44px;padding:0 14px 0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
.toggle .box{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center}
.toggle .box svg{width:13px;height:13px;opacity:0}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggle[aria-pressed="true"] .box{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent)}
.toggle[aria-pressed="true"] .box svg{opacity:1}
.del{flex:none;height:42px;min-width:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700}
.del.sure{background:var(--danger);border-color:var(--danger);color:#fff}
.sup-empty{padding:16px;color:var(--muted);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Formulaire d'ajout */
.add{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.add h3{font-size:19px;font-weight:800}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.add input,.add select{height:50px;border:1px solid var(--line);border-radius:12px;background:var(--sunken);padding:0 12px;width:100%}
.btn{height:50px;border-radius:12px;border:0;padding:0 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--sunken);border:1px solid var(--line);color:var(--fg)}
.newsup{display:flex;gap:8px}
.newsup input{flex:1}
.sep{height:1px;background:var(--line);margin:6px 0}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;padding-top:12px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;padding:6px 0}

/* Commande */
.cmd-sup{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cmd-sup header{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cmd-sup .ico{width:44px;height:44px;border-radius:13px}
.cmd-sup .ico svg{width:26px;height:26px}
.cmd-sup h2{font-size:19px;font-weight:800;flex:1}
.cmd-sup header span{font-size:13px;color:var(--muted);font-weight:600}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-top:1px solid var(--line);min-height:58px}
.cmd-item:first-of-type{border-top:0}
.cmd-item .name{flex:1;min-width:0;font-weight:600}
.qpill{flex:none;font-weight:800;font-size:15px;padding:6px 12px;border-radius:10px;background:var(--accent-soft);font-variant-numeric:tabular-nums}
.qpill.none{background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:0}
.empty{text-align:center;color:var(--muted);padding:44px 18px;border:1px dashed var(--line);border-radius:20px;margin-top:16px;background:var(--surface)}
.empty strong{display:block;color:var(--fg);font-size:19px;margin-bottom:6px;font-family:var(--display)}
.done{margin-top:22px}
.done .btn{width:100%;height:62px;font-size:18px;background:var(--go);color:var(--go-ink)}
.done .btn.confirm{background:var(--fg);color:var(--bg)}
.done p{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0}

.item .name,.cmd-item .name{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:30px;white-space:nowrap;padding:2px 10px;border-radius:9px;border:1px dashed var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip.has{border-style:solid;background:var(--sunken);color:var(--fg)}
.pchip small{font-size:12px;color:var(--muted);font-weight:500}
.var{font-size:12px;font-weight:800;border-radius:6px;padding:1px 5px}
.var.up{color:#fff;background:var(--danger)} .var.down{color:#fff;background:var(--go)} .var.eq{color:var(--muted);background:var(--line)}
.sheet{position:fixed;inset:0;background:rgba(10,8,4,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet h3{font-size:21px;font-weight:800}
.sheet .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px}
.prow .in{position:relative}
.prow input{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--sunken);font-size:24px;font-weight:800;text-align:center;padding:0 40px 0 12px;font-variant-numeric:tabular-nums}
.prow .in span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted);font-size:18px}
.prow select{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--sunken);padding:0 10px;font-weight:700}
.hist{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist h4{margin:0;padding:10px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunken);display:flex;justify-content:space-between;gap:8px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hrow .dt{flex:1;color:var(--muted);font-size:14px}
.hrow b{font-size:16px}
.hrow .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:10;max-width:calc(100% - 32px)}
@media (max-width:400px){.titles h1{font-size:25px}header.top .logo{width:92px;height:54px}.ico{width:46px;height:46px}.ico svg{width:28px;height:28px}.toggle{padding:0 12px 0 8px;font-size:13px}.qty{width:62px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* Cuisine / Boissons */
.secsw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.secsw button{height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.secsw button .e{font-size:22px}
.secsw button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.secsw .n{min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:13px;display:inline-grid;place-items:center;padding:0 7px}
/* Boutons ✏️ ✖️ sur chaque article */
.item .name>span:first-child,.cmd-item .name>span:first-child{flex:1 1 120px;min-width:0}
.ib{flex:none;width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0}
.ib svg{width:17px;height:17px}
.ib.x:hover,.ib.x:active{color:var(--danger);border-color:var(--danger)}
.badge-promo{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:#d63a2a;border-radius:6px;padding:2px 6px;line-height:1.2;box-shadow:0 1px 0 rgba(0,0,0,.12)}
/* Fenêtres */
.sheet .acts{display:grid;gap:8px}
.sheet .acts .btn{height:56px;font-size:17px}
.btn.danger{background:var(--danger);color:#fff}
.sheet .field input,.sheet .field select{height:54px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunken);padding:0 12px;width:100%;font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunken);font-weight:700;font-size:16px;cursor:pointer}
.sw{position:relative;width:56px;height:32px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:#d63a2a}
.sw input:checked+i::after{transform:translateX(24px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
/* À commander : blocs repliables + validation par fournisseur */
.cmd-sup header{cursor:pointer;width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left}
.cmd-sup[data-open="false"] header{border-bottom:0}
.cmd-sup[data-open="false"] .cmd-body{display:none}
.cmd-sup .chev{transition:transform .2s ease}
.cmd-sup[data-open="true"] .chev{transform:rotate(90deg)}
.cmd-done{padding:12px 14px;border-top:1px solid var(--line);background:var(--sunken)}
.cmd-done .btn{width:100%;height:54px;font-size:17px;background:var(--go);color:var(--go-ink)}
.cmd-done .btn.confirm{background:var(--fg);color:var(--bg)}
/* Coup de couteau */
.cut{position:relative;margin-top:16px;pointer-events:none}
.cut>.cmd-sup{position:absolute;inset:0;margin:0!important;transition:transform .32s cubic-bezier(.5,0,.75,0),opacity .32s ease-in}
.cut .knife{position:absolute;left:0;top:0;width:84px;height:84px;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.cut svg.slash{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible}
.cmd-item{flex-wrap:wrap}
.okc{flex:none;height:44px;display:flex;align-items:center;gap:7px;padding:0 12px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;color:var(--go)}
.okc .ring{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--go);display:grid;place-items:center;transition:background .15s,transform .15s}
.okc .ring svg{width:16px;height:16px;color:#fff;opacity:0;transition:opacity .15s}
.okc.on .ring{background:var(--go);transform:scale(1.12)}
.okc.on .ring svg{opacity:1}
.cmd-item.gone{transition:transform .3s ease-in,opacity .3s ease-in,height .3s ease .05s,min-height .3s ease .05s,padding .3s ease .05s;transform:translateX(60%);opacity:0;height:0!important;min-height:0;padding-block:0;overflow:hidden}
.cmd-item .name{flex:1 1 170px}
.sup-head{cursor:pointer}
.fiche{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-grid;place-items:center;margin-left:8px;vertical-align:3px;padding:0}
.fiche svg{width:17px;height:17px}
.fiche.has{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent)}
.sendb{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.sendb svg{width:16px;height:16px}
.seg a.btn{text-decoration:none}
.hc{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--sunken)}
.hc summary{padding:12px;cursor:pointer;font-size:15px;list-style-position:inside}
.hc .hn{color:var(--muted);font-size:13px;font-weight:600}
.hc ul{margin:0;padding:0 14px 12px 30px;font-size:15px}
.hc li span{color:var(--muted)}
.sup-name small .count{display:inline-block;margin-left:6px;padding:2px 8px;font-size:12px}

.biglogo{display:flex;align-items:center;gap:14px;justify-content:center}
.biglogo img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.biglogo .bl-n{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.5px;color:var(--fg,#1d1b17);text-align:left}
.biglogo .bl-n b{color:#f2a516}
.biglogo .bl-t{font-family:"Figtree",system-ui,sans-serif;font-weight:800;font-size:11px;letter-spacing:.2em;margin-top:7px;color:var(--fg,#1d1b17);text-align:left}
.biglogo .bl-t b{color:#f2a516}
/* Passage d'un onglet à l'autre : fondu court, la barre du haut ne bouge pas */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s;animation-timing-function:ease-out}
.pbar{view-transition-name:pbar}.apps{view-transition-name:apps}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.logo img{aspect-ratio:1000/403}
</style>
</head>
<body>

<div class="wrap gate" id="gate" hidden>
  <div class="biglogo"><img src="icone-appli.svg" alt="" width="84" height="84"><div><div class="bl-n">Double <b>B</b></div><div class="bl-t">COMMANDE <b>·</b> DEVIS <b>·</b> ANALYSE</div></div></div>
  <p>Entre le code d'accès de l'équipe. Il est demandé une seule fois sur ce téléphone.</p>
  <form id="gateForm" autocomplete="off">
    <input id="gateCode" placeholder="Code d'accès" autocapitalize="off" autocorrect="off" spellcheck="false" required aria-label="Code d'accès">
    <button class="btn" type="submit">Entrer</button>
    <div class="err" id="gateErr" hidden></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <div class="pbar" id="pbar"></div><script src="profil.js"></script>
  <div class="sync" id="sync">Connexion…</div>
  <header class="top">
    <div class="logo"><img src="logo-hd.png" alt="Double B" width="1000" height="403"></div>
    <div class="titles"><h1>Commande</h1><div class="date" id="now">&nbsp;</div></div>
  </header>

  <div class="secsw" role="group" aria-label="Partie">
    <button type="button" data-sec="cuisine" aria-pressed="true"><span class="e">🍳</span>Cuisine <span class="n" id="nCuisine" hidden></span></button>
    <button type="button" data-sec="boissons" aria-pressed="false"><span class="e">🍸</span>Bar &amp; Salle <span class="n" id="nBoissons" hidden></span></button>
  </div>

  <div class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="liste" aria-selected="true">Produits</button>
    <button role="tab" data-tab="commande" aria-selected="false">À commander <span class="badge" id="badge" hidden></span></button>
  </div>

  <section id="view-liste">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Chercher un produit… ex. iceberg, agria" autocomplete="off" aria-label="Chercher un produit">
      <button type="button" id="qClear" aria-label="Effacer la recherche" hidden>×</button>
    </div>
    <div class="qinfo" id="qinfo" hidden></div>
    <div class="suppliers" id="suppliers"><div class="empty"><strong>Chargement…</strong>Tes fournisseurs et leurs produits arrivent.</div></div>

    <form class="add" id="addForm" autocomplete="off">
      <h3 id="addTitle">Ajouter un produit</h3>
      <div class="field"><label for="nNom">Produit</label><input id="nNom" placeholder="ex. Ciboulette" maxlength="60" required></div>
      <div class="field"><label for="nFour">Fournisseur</label><select id="nFour"></select></div>
      <button class="btn" type="submit">Ajouter le produit</button>
      <div class="sep"></div>
      <div class="field"><label for="nSup">Nouveau fournisseur</label>
        <div class="newsup"><input id="nSup" placeholder="ex. Brasserie Galibot" maxlength="40"><button class="btn soft" type="button" id="addSup">Créer</button></div>
      </div>
    </form>
    <div class="links">
      <button class="linkbtn" id="invite" type="button">Inviter l'équipe</button>
      <button class="linkbtn" id="logout" type="button">Changer de code</button>
      <button class="linkbtn" id="backup" type="button">Télécharger une sauvegarde</button>
    </div>
  </section>

  <section id="view-commande" hidden><div id="commande"></div>
    <div class="links"><button class="linkbtn" id="histBtn" type="button">🕘 Historique des commandes</button></div></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Connexion à la base (clé publique : les données restent protégées par le code d'équipe) */
const API="https://kokjumjhpasxxxrpspng.supabase.co/rest/v1/rpc/";
const KEY="sb_publishable_HIJXH1eJ_CP-A4G3AecDKg_NbBUD0m2";
const CK="commande2b-code";
const DEFAULT_SUPS=["Maraîcher","Sysco","Coup de Pâtes"];
const UNITS=["pièce","kg","g","L","douzaine","carton","colis","botte","sac","seau","barquette","bouteille","fût","pack"];
const plU=(u,q)=>q>1&&/^(pièce|botte|barquette|bouteille|carton|colis|sac|seau|pack|douzaine)$/.test(u)?u+"s":u;   // « 12 pièces »
const S={items:new Map(),sups:[...DEFAULT_SUPS],supSec:{},fiches:{},ready:false,open:{},copen:{},q:"",code:null,pending:0,sec:"cuisine",busy:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const fold=s=>s.normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae");
const norm=s=>fold(String(s)).replace(/[^a-z0-9]+/g," ").trim();
const fmt=n=>String(Math.round(n*1000)/1000).replace(".",",");
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const SECN={cuisine:"Cuisine",boissons:"Bar & Salle"};   // « boissons » en base : boissons + fournitures de la salle (serviettes, bretzels…)

async function rpc(fn,args={}){
  const r=await fetch(API+fn,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({p_code:S.code,...args})});
  if(!r.ok){let e={};try{e=await r.json()}catch{}const err=new Error(e.message||"Erreur réseau");err.code=e.code;err.status=r.status;throw err}
  const t=await r.text();return t?JSON.parse(t):null;
}
function setSync(t,cls){const s=$("#sync");s.textContent=t;s.className="sync"+(cls?" "+cls:"")}

/* Code d'équipe : lien d'invitation (#code=…) ou saisie, gardé sur le téléphone */
async function boot(){
  const h=new URLSearchParams(location.hash.slice(1)).get("code");
  if(h){store.set(CK,h.trim());history.replaceState(null,"",location.pathname+location.search)}
  S.code=store.get(CK);
  if(!S.code){showGate();return}
  showApp();   // on affiche tout de suite (dernières données connues), le code est vérifié en arrière-plan
  try{const ok=await rpc("verifier");if(!ok){store.del(CK);showGate("Ce code n'est plus valable.")}}
  catch(e){/* hors ligne : la synchro reprendra */}
}
function showGate(msg){document.documentElement.classList.remove("has-code");document.querySelector(".bnav")?.remove();$("#app").hidden=true;$("#gate").hidden=false;const er=$("#gateErr");er.hidden=!msg;er.textContent=msg||"";setTimeout(()=>$("#gateCode").focus(),100)}
$("#gateForm").addEventListener("submit",async e=>{
  e.preventDefault();const c=$("#gateCode").value.trim();if(!c)return;S.code=c;
  try{const ok=await rpc("verifier");if(ok){store.set(CK,c);showApp()}else showGate("Code incorrect. Vérifie avec le gérant.")}
  catch{showGate("Pas de connexion internet. Réessaie dans un instant.")}
});
function useData(d){
  S.items=new Map(d.produits.map(p=>[p.id,{...p,section:p.section||"cuisine",qte:p.qte==null?null:+p.qte}]));
  S.sups=d.fournisseurs.length?d.fournisseurs:[...DEFAULT_SUPS];S.supSec=d.sections||{};S.fiches=d.fiches||{};S.ready=true;
}
function showApp(){$("#gate").hidden=true;$("#app").hidden=false;
  if(!S.ready){try{const c=JSON.parse(store.get("commande2b-cache")||"null");if(c&&c.produits){useData(c);render()}}catch{}}
  refresh();startPolling();
  const go=()=>window.Profil&&window.Profil.ensure();if(window.Profil)go();else addEventListener("load",go)}

/* Synchronisation : rafraîchit toutes les 5 s quand l'appli est ouverte */
let pollT=null;
function startPolling(){clearInterval(pollT);pollT=setInterval(()=>{if(document.visibilityState==="visible")refresh()},5000)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.code)refresh()});
/* Hors connexion : chaque action est gardée sur le téléphone et envoyée dès que le réseau revient */
const QK="commande2b-file";
let OUT=[];try{OUT=JSON.parse(store.get(QK)||"[]")}catch{OUT=[]}
const saveOut=()=>store.set(QK,JSON.stringify(OUT));
const isNet=e=>e instanceof TypeError||(!e.code&&!e.status);
const waitTxt=()=>`${OUT.length} modification${OUT.length>1?"s":""} en attente de réseau`;
let flushing=false;
async function flush(){
  if(flushing||!OUT.length||!S.code)return;flushing=true;
  try{while(OUT.length){const [fn,args]=OUT[0];try{await rpc(fn,args)}catch(e){if(isNet(e))break}OUT.shift();saveOut()}}
  finally{flushing=false}
  if(OUT.length)setSync(waitTxt(),"err");else{toast("Réseau revenu : tout est envoyé ✓");refresh()}
}
addEventListener("online",flush);setInterval(()=>{if(OUT.length)flush()},15000);
async function refresh(){
  if(OUT.length){flush();return}
  if(S.pending>0||S.busy)return;
  try{
    const d=await rpc("etat");if(S.pending>0||S.busy)return;
    useData(d);store.set("commande2b-cache",JSON.stringify(d));
    setSync("À jour","ok");
    const a=document.activeElement;if(!(a&&(a.matches(".qty")||a.matches(".unit")))&&!document.querySelector(".sheet"))render();
  }catch(e){
    if(e.code==="28000"){store.del(CK);S.code=null;showGate("Le code a changé. Entre le nouveau code.");return}
    setSync("Hors ligne","err");if(!S.ready){S.ready=true;render()}
  }
}
async function send(fn,args){
  if(OUT.length){OUT.push([fn,args]);saveOut();setSync(waitTxt(),"err");return null}
  S.pending++;setSync("Enregistrement…");
  try{const r=await rpc(fn,args);S.pending--;if(!S.pending)refresh();return r}
  catch(e){S.pending--;
    if(isNet(e)){OUT.push([fn,args]);saveOut();setSync(waitTxt(),"err");toast("Pas de réseau : c'est gardé sur le téléphone et envoyé dès qu'il revient");return null}
    toast(e.code==="28000"?"Code refusé":"Pas enregistré");refresh();throw e}
}
const profil=()=>{try{return localStorage.getItem("2b-profil")||""}catch{return ""}};
function trace(f,sec,ps){const l=ps.map(p=>({n:p.nom,q:p.qte??null,u:p.qte?p.unite:null}));if(l.length)send("commande_trace",{p_fournisseur:f,p_section:sec,p_lignes:l,p_par:profil()}).catch(()=>{})}

/* Icônes fournisseurs */
const ICONS={
  mar:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.5c-3-3-7.4-1.8-9.3 2.4L5 26.6c-.4.9.5 1.8 1.4 1.4l11.7-5.2c4.2-1.9 5.4-6.3 2.4-9.3z"/><path d="M12 19l2.5 1.5M10.5 23l2 1.2M15.5 15.5l2 2"/><path d="M19.5 12.5c.6-2.8 2.6-5 5.5-5.5M20.5 11.5c1-1.6 1.2-4 .3-6.5M21.5 13c1.8.8 4.2.8 6.5-.2"/></svg>',
  sys:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h15v13H3z"/><path d="M18 12h5.5l4.5 5v4h-10"/><circle cx="8.5" cy="23.5" r="2.5"/><circle cx="22.5" cy="23.5" r="2.5"/><path d="M7 12.5h7M7 16h5"/></svg>',
  cdp:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 25.5c-2.2-2.2-1.4-6.4 2.2-10l6.8-6.8c3.6-3.6 7.8-4.4 10-2.2s1.4 6.4-2.2 10l-6.8 6.8c-3.6 3.6-7.8 4.4-10 2.2z"/><path d="M11 17.5l3 1.5M14.5 14l3 1.5M18 10.5l3 1.5"/></svg>',
  boi:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6v5l2 3.5V28a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1V11.5L13 8z"/><path d="M11 16h10M11 23h10"/></svg>',
  oth:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l12-6 12 6v12l-12 6-12-6z"/><path d="M4 10l12 6 12-6M16 16v12"/></svg>'
};
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const CHEV='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const CARD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4M14.5 10h4M14.5 13.5h3"/></svg>';
const PLANE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg>';
const CROSS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function supKind(name){const n=fold(name);
  if(/marai|primeur|fruit|legume/.test(n))return "mar";
  if(/sysco|metro|transgourmet|promocash|grossiste/.test(n))return "sys";
  if(/coup de pat|boulang|pain|patiss/.test(n))return "cdp";
  if(/brasser|boisson|biere|vin|galibot|cave|soda|eau/.test(n))return "boi";
  return S.sec==="boissons"?"boi":"oth"}
function supStyle(name){const k=supKind(name);const c=k==="boi"?"oth":k;return `--c:var(--c-${c});--soft:var(--c-${c}-soft)`}
const supIcon=name=>ICONS[supKind(name)];

/* Date et heure */
function tick(){const d=new Date();
  let j=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});j=j.charAt(0).toUpperCase()+j.slice(1);
  $("#now").innerHTML=`<b>${esc(j)}</b> · ${esc(d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}))}`}
tick();setInterval(tick,20000);

/* Repli des fournisseurs, propre au téléphone */
try{S.open=JSON.parse(store.get("commande2b-open")||"{}")}catch{}
try{S.copen=JSON.parse(store.get("commande2b-copen")||"{}")}catch{}
S.sec=store.get("commande2b-sec")==="boissons"?"boissons":"cuisine";
const okey=n=>S.sec+"|"+n;
const isOpen=n=>S.open[okey(n)]!==false;
function setOpen(n,v){S.open[okey(n)]=v;store.set("commande2b-open",JSON.stringify(S.open))}
const isCOpen=n=>S.copen[okey(n)]!==false;
function setCOpen(n,v){S.copen[okey(n)]=v;store.set("commande2b-copen",JSON.stringify(S.copen))}

/* Recherche par mots-clés */
function terms(){return fold(S.q||"").split(/[^a-z0-9]+/).filter(Boolean)}
function matches(p,ts){if(!ts.length)return true;const hay=fold(p.nom+" "+p.fournisseur);return ts.every(t=>hay.includes(t))}
function hl(text,ts){
  if(!ts.length)return esc(text);
  const map=[];let f="";
  for(let i=0;i<text.length;i++){const c=fold(text[i]);for(let k=0;k<c.length;k++){f+=c[k];map.push(i)}}
  const on=new Array(text.length).fill(false);
  ts.forEach(t=>{let i=f.indexOf(t);while(i>-1){for(let k=i;k<i+t.length;k++)on[map[k]]=true;i=f.indexOf(t,i+1)}});
  let out="",open=false;
  for(let i=0;i<text.length;i++){if(on[i]&&!open){out+="<mark>";open=true}if(!on[i]&&open){out+="</mark>";open=false}out+=esc(text[i])}
  return out+(open?"</mark>":"");
}
function label(nom){const ts=terms();const m=nom.match(/^(.*?)\s*(\(.+\))$/);return m?`${hl(m[1],ts)} <em>${hl(m[2],ts)}</em>`:hl(nom,ts)}

/* Prix : dernier prix noté, promo et évolution par rapport au précédent */
const PUNITS=["kg","pièce","L","douzaine","carton","colis","botte","barquette","sac","seau","bouteille","fût","pack"];
const eur=n=>new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:3}).format(n)+" €";
const dshort=d=>new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"});
const PROMO='<span class="badge-promo">PROMO</span>';
function varPct(a,b){if(!a||!b||a.u!==b.u)return null;return Math.round((a.p-b.p)/b.p*1000)/10}
function varHTML(v){if(v==null)return "";const c=v>0?"up":v<0?"down":"eq";return `<span class="var ${c}">${v>0?"▲ +":v<0?"▼ ":""}${String(v).replace(".",",")} %</span>`}
function chip(p){
  if(!p.prix)return `<button class="pchip" data-prix="${p.id}" aria-label="Noter le prix de ${esc(p.nom)}">+ prix</button>`;
  return `<button class="pchip has" data-prix="${p.id}" aria-label="Prix de ${esc(p.nom)}">${eur(+p.prix.p)}/${esc(p.prix.u)} ${p.prix.promo?PROMO:varHTML(varPct(p.prix,p.avant))}</button>`;
}
const tools=p=>`<button class="ib" data-edit="${p.id}" aria-label="Modifier ${esc(p.nom)}">${PEN}</button><button class="ib x" data-del="${p.id}" aria-label="Supprimer ${esc(p.nom)}">${CROSS}</button>`;

/* Recherche rapide : tous les fournisseurs, Cuisine et Bar & Salle, tolérante aux accents et à une petite faute de frappe */
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;
  while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;
    if(a.length>b.length)i++;else if(a.length<b.length)j++;else if(a[i+1]===b[j]&&a[i]===b[j+1]){i+=2;j+=2}else{i++;j++}}
  return e+(a.length-i)+(b.length-j)<=1}
function quickHits(ts){
  const all=[...S.items.values()];
  const score=(p,fuzzy)=>{const h=fold(p.nom),ws=fold(p.nom+" "+p.fournisseur).split(/[^a-z0-9]+/).filter(Boolean);let sc=0;
    for(const t of ts){if(h.startsWith(t))sc+=3;else if(ws.some(w=>w.startsWith(t)))sc+=2;else if(ws.some(w=>w.includes(t)))sc+=1;
      else if(fuzzy&&t.length>=3&&ws.some(w=>lev1(w.slice(0,t.length),t)||lev1(w,t)))sc+=.5;else return null}
    return sc+(inSec(p)?.5:0)};
  let r=all.map(p=>[p,score(p,false)]).filter(x=>x[1]!=null),fuzzy=false;
  if(!r.length){r=all.map(p=>[p,score(p,true)]).filter(x=>x[1]!=null);fuzzy=r.length>0}
  const out=r.sort((a,b)=>b[1]-a[1]||a[0].nom.localeCompare(b[0].nom,"fr")).map(x=>x[0]);out.fuzzy=fuzzy;return out}
function qrHTML(p){
  const other=!inSec(p)?` · <i>${(p.section||"cuisine")==="boissons"?"🍸 Bar & Salle":"🍳 Cuisine"}</i>`:"";
  // Une fois commandé : quantité ET unité modifiables directement dans le résultat (avant, l'unité manquait ici)
  const tog=`<button class="toggle" type="button" data-t="${p.id}" aria-pressed="${p.acommander}" aria-label="${p.acommander?`Retirer ${esc(p.nom)} de la commande`:`Commander ${esc(p.nom)}`}"><span class="box">${CHECK}</span>${p.acommander?"":"Commander"}</button>`;
  const units=UNITS.includes(p.unite)||!p.unite?UNITS:[p.unite,...UNITS];
  const px=p.prix?` · <span class="qp">${eur(+p.prix.p)}/${esc(p.prix.u)}</span>${p.prix.promo?" "+PROMO:""}`:"";
  return `<div class="qr${p.acommander?" on":""}"><div class="qr-t" role="button" tabindex="0" data-voir="${p.id}" aria-label="Voir la fiche de ${esc(p.nom)}"><b>${label(p.nom)} <span class="qgo" aria-hidden="true">›</span></b><small>${esc(p.fournisseur)}${px}${other}</small></div>
    ${p.acommander?`<div class="qr-c"><input class="qty" type="number" inputmode="decimal" min="0" max="10000" step="any" placeholder="Qté" value="${p.qte??""}" data-q="${p.id}" aria-label="Quantité de ${esc(p.nom)} (facultatif)">
      <select class="unit" data-u="${p.id}" aria-label="Unité de ${esc(p.nom)}">${units.map(u=>`<option${u===(p.unite||"pièce")?" selected":""}>${esc(u)}</option>`).join("")}</select>${tog}</div>`:tog}</div>`}
/* La liste des résultats s'arrête juste au-dessus du clavier */
function fitQres(){const el=$(".qres");if(!el)return;const vv=window.visualViewport;const h=vv?vv.height:innerHeight;
  const top=el.getBoundingClientRect().top-(vv?vv.offsetTop:0);
  const nb=document.querySelector(".bnav");const r=nb&&nb.getBoundingClientRect();const nbH=r&&r.top<(vv?vv.offsetTop+vv.height:innerHeight)?r.height:0;   // la barre du bas reste visible : on s'arrête au-dessus
  el.style.maxHeight=Math.max(180,Math.round(h-top-10-nbH))+"px"}
if(window.visualViewport){visualViewport.addEventListener("resize",fitQres);visualViewport.addEventListener("scroll",fitQres)}
addEventListener("scroll",fitQres,{passive:true});

/* Rendu */
const inSec=p=>(p.section||"cuisine")===S.sec;
function allSups(){const extra=[...new Set([...S.items.values()].map(p=>p.fournisseur))].filter(f=>!S.sups.includes(f));return [...S.sups,...extra]}
function supList(){return allSups().filter(f=>(S.supSec[f]||"cuisine")===S.sec||[...S.items.values()].some(p=>p.fournisseur===f&&inSec(p)))}
function itemsOf(f){return [...S.items.values()].filter(p=>p.fournisseur===f&&inSec(p)).sort((a,b)=>a.ordre-b.ordre||a.nom.localeCompare(b.nom,"fr"))}
function render(){
  const sups=supList();const all=[...S.items.values()];const mine=all.filter(inSec);const n=mine.filter(p=>p.acommander).length;
  const b=$("#badge");b.hidden=!n;b.textContent=n;
  ["cuisine","boissons"].forEach(sec=>{const k=all.filter(p=>(p.section||"cuisine")===sec&&p.acommander).length;const el=$(sec==="cuisine"?"#nCuisine":"#nBoissons");el.hidden=!k;el.textContent=k});
  document.querySelectorAll("[data-sec]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.sec===S.sec));
  $("#addTitle").textContent="Ajouter un produit — "+SECN[S.sec];
  $("#q").placeholder=S.sec==="boissons"?"Chercher… ex. coca, serviettes, bretzels":"Chercher un produit… ex. iceberg, agria";
  const sel=$("#nFour"),cur=sel.value;const others=allSups().filter(f=>!sups.includes(f));
  sel.innerHTML=sups.map(f=>`<option>${esc(f)}</option>`).join("")+(others.length?`<optgroup label="Autres fournisseurs">${others.map(f=>`<option>${esc(f)}</option>`).join("")}</optgroup>`:"");
  if(allSups().includes(cur))sel.value=cur;
  if(!S.ready)return;
  const ts=terms();
  if(ts.length){
    const res=quickHits(ts);const hits=res.length;const info=$("#qinfo");info.hidden=false;
    info.innerHTML=hits?`<span>${hits} produit${hits>1?"s":""} trouvé${hits>1?"s":""}${res.fuzzy?" (en corrigeant la faute)":""}</span>`
      :`<span>Aucun produit ne correspond à « ${esc(S.q.trim())} ».</span><button class="btn soft" type="button" id="qAdd">Ajouter « ${esc(S.q.trim())} »</button>`;
    const old=$(".qres"),top=old?old.scrollTop:0;
    $("#suppliers").innerHTML=hits?`<div class="qres">${res.slice(0,40).map(qrHTML).join("")}${hits>40?`<div class="qr-more">Tape quelques lettres de plus pour voir les autres.</div>`:""}</div>`:"";
    const nw=$(".qres");if(nw){nw.scrollTop=top;fitQres()}
  }else{
    $("#qinfo").hidden=true;
    $("#suppliers").innerHTML=sups.map(supHTML).join("")||`<div class="empty"><strong>Aucun fournisseur ${S.sec==="boissons"?"pour le bar et la salle":""}</strong>Crée-en un avec le formulaire ci-dessous.</div>`;
  }
  renderCmd(sups);
}
function supHTML(f){
  const ts=terms();const all=itemsOf(f);const ps=ts.length?all.filter(p=>matches(p,ts)):all;
  const k=all.filter(p=>p.acommander).length;const open=ts.length?true:isOpen(f);
  const hasAny=[...S.items.values()].some(p=>p.fournisseur===f);
  const body=ps.length?ps.map(itemHTML).join("")
    :`<div class="sup-empty"><span>Aucun produit pour l'instant.</span>${!hasAny&&!DEFAULT_SUPS.includes(f)?`<button class="del" data-delsup="${esc(f)}">Supprimer ce fournisseur</button>`:""}</div>`;
  return `<section class="sup" data-open="${open}" style="${supStyle(f)}">
    <div class="sup-head" role="button" tabindex="0" data-sup="${esc(f)}" aria-expanded="${open}">
      <span class="ico" aria-hidden="true">${supIcon(f)}</span>
      <span class="sup-name"><h2>${esc(f)}<button class="fiche${S.fiches[f]?" has":""}" type="button" data-fiche="${esc(f)}" aria-label="Fiche du fournisseur ${esc(f)}">${CARD}</button></h2><small>${ts.length?`${ps.length} sur ${all.length} produits`:`${all.length} produit${all.length>1?"s":""}`}${k?` <span class="count">${k} à commander</span>`:""}</small></span>
      <span class="chev" aria-hidden="true">${CHEV}</span>
    </div>
    <div class="sup-body">${body}</div></section>`;
}
function itemHTML(p){
  return `<div class="item${p.acommander?" on":""}"><div class="name"><span>${label(p.nom)}</span>${chip(p)}${tools(p)}</div>
    <div class="ctrls">
      <input class="qty" type="number" inputmode="decimal" min="0" max="10000" step="any" placeholder="Qté" value="${p.qte??""}" data-q="${p.id}" aria-label="Quantité de ${esc(p.nom)} (facultatif)">
      <select class="unit" data-u="${p.id}" aria-label="Unité de ${esc(p.nom)}">${(UNITS.includes(p.unite)?UNITS:[p.unite,...UNITS]).map(u=>`<option${u===p.unite?" selected":""}>${esc(u)}</option>`).join("")}</select>
      <button class="toggle" data-t="${p.id}" aria-pressed="${p.acommander}"><span class="box">${CHECK}</span>${p.acommander?"À commander":"Commander"}</button>
    </div></div>`;
}
function renderCmd(sups){
  const el=$("#commande");
  const groups=sups.map(f=>[f,itemsOf(f).filter(p=>p.acommander)]).filter(g=>g[1].length);
  if(!groups.length){el.innerHTML=`<div class="empty"><strong>Rien à commander en ${SECN[S.sec].toLowerCase()}</strong>Dans l'onglet Produits, appuie sur « Commander » à côté de ce qui manque. La quantité est facultative.</div>`;return}
  el.innerHTML=groups.map(([f,ps])=>{const open=isCOpen(f);return `<section class="cmd-sup" data-open="${open}" data-cmdsup="${esc(f)}" style="${supStyle(f)}">
    <header role="button" tabindex="0" data-ctog="${esc(f)}" aria-expanded="${open}"><span class="ico" aria-hidden="true">${supIcon(f)}</span><h2>${esc(f)}</h2><span>${ps.length} article${ps.length>1?"s":""}</span>${supKind(f)==="mar"?`<button class="sendb" type="button" data-send="${esc(f)}" aria-label="Envoyer la commande à ${esc(f)}">${PLANE}</button>`:""}<span class="chev" aria-hidden="true">${CHEV}</span></header>
    <div class="cmd-body">${ps.map(p=>`<div class="cmd-item"><div class="name"><span>${esc(p.nom)}</span>${chip(p)}</div>${p.qte?`<span class="qpill">${fmt(p.qte)} ${esc(plU(p.unite,p.qte))}</span>`:`<span class="qpill none">quantité libre</span>`}<button class="okc" data-ok="${p.id}" aria-label="${esc(p.nom)} est commandé"><span class="ring">${CHECK}</span>Commandé</button><button class="del" data-t="${p.id}" aria-label="Retirer ${esc(p.nom)} de la commande">Retirer</button></div>`).join("")}
    <div class="cmd-done"><button class="btn" type="button" data-done="${esc(f)}">Commande effectuée chez ${esc(f)}</button></div></div></section>`}).join("");
}

/* Petites fenêtres (confirmations, choix) : gros boutons, rien de caché */
function ask(title,text,buttons){return new Promise(res=>{
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${text?`<div class="sub" style="margin-top:0">${text}</div>`:""}<div class="acts">${buttons.map((b,i)=>`<button class="btn ${b.cls||""}" type="button" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
  document.body.appendChild(m);
  const close=v=>{m.remove();res(v)};
  m.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)close(buttons[+b.dataset.i].value);else if(e.target===m)close(null)});
})}

/* Actions */
$("#q").addEventListener("input",e=>{S.q=e.target.value;$("#qClear").hidden=!S.q;render()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";S.q="";$("#qClear").hidden=true;render()}});
document.addEventListener("mousedown",e=>{if(e.target.closest(".qres .toggle")&&document.activeElement===$("#q"))e.preventDefault()});
/* En tapant, la barre de recherche remonte juste sous les onglets (qui restent collés en haut) : les résultats ont toute la place au-dessus du clavier */
$("#q").addEventListener("focus",()=>setTimeout(()=>{const tb=$(".tabs"),r=$(".search").getBoundingClientRect();const want=tb.offsetHeight+(parseFloat(getComputedStyle(tb).top)||0)+8;
  if(Math.abs(r.top-want)>24)window.scrollBy({top:r.top-want,behavior:"smooth"});setTimeout(fitQres,350)},280));
$("#qClear").onclick=()=>{$("#q").value="";S.q="";$("#qClear").hidden=true;render();$("#q").focus()};
document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{S.sec=b.dataset.sec;store.set("commande2b-sec",S.sec);render()});
document.addEventListener("click",async e=>{
  if(e.target.id==="qAdd"){$("#nNom").value=S.q.trim();$("#addForm").scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>$("#nFour").focus(),300);return}
  const pc=e.target.closest("[data-prix]");if(pc){openPrice(pc.dataset.prix);return}
  const vo=e.target.closest("[data-voir]");if(vo){$("#q").blur();openPrice(vo.dataset.voir,{recherche:true});return}
  const ed=e.target.closest("[data-edit]");if(ed){openEdit(ed.dataset.edit);return}
  const fi=e.target.closest("[data-fiche]");if(fi){openFiche(fi.dataset.fiche);return}
  const sd=e.target.closest("[data-send]");if(sd){sendSupplier(sd.dataset.send);return}
  const h=e.target.closest("[data-sup]");
  if(h){if(terms().length)return;const f=h.dataset.sup;setOpen(f,!isOpen(f));const sec=h.closest(".sup");sec.dataset.open=isOpen(f);h.setAttribute("aria-expanded",isOpen(f));return}
  const ct=e.target.closest("[data-ctog]");
  if(ct){const f=ct.dataset.ctog;setCOpen(f,!isCOpen(f));const sec=ct.closest(".cmd-sup");sec.dataset.open=isCOpen(f);ct.setAttribute("aria-expanded",isCOpen(f));return}
  const t=e.target.closest("[data-t]");
  if(t){const p=S.items.get(t.dataset.t);if(!p)return;
    p.acommander=!p.acommander;const champs={acommander:p.acommander};if(!p.acommander){p.qte=null;champs.qte=""}
    render();send("maj_produit",{p_id:p.id,p_champs:champs}).catch(()=>{});
    if(t.closest(".qres")){if(p.acommander&&navigator.vibrate)navigator.vibrate(12);const q=$("#q");if(document.activeElement===q||e.detail===0){q.focus({preventScroll:true});q.setSelectionRange(0,q.value.length)}}
    return}
  const d=e.target.closest("[data-del]");
  if(d){const p=S.items.get(d.dataset.del);if(!p)return;
    const ok=await ask("Supprimer cet article ?",`<b>${esc(p.nom)}</b> chez ${esc(p.fournisseur)}. Son historique de prix sera aussi effacé.`,[{label:"Oui, supprimer",value:true,cls:"danger"},{label:"Annuler",value:false,cls:"soft"}]);
    if(!ok)return;S.items.delete(p.id);render();send("suppr_produit",{p_id:p.id}).then(()=>toast(p.nom+" supprimé")).catch(()=>{});return}
  const ds=e.target.closest("[data-delsup]");
  if(ds){const f=ds.dataset.delsup;const ok=await ask("Supprimer ce fournisseur ?",esc(f),[{label:"Oui, supprimer",value:true,cls:"danger"},{label:"Annuler",value:false,cls:"soft"}]);if(!ok)return;
    S.sups=S.sups.filter(x=>x!==f);render();send("suppr_fournisseur",{p_nom:f}).then(()=>toast("Fournisseur supprimé")).catch(()=>{});return}
  const ok=e.target.closest("[data-ok]");
  if(ok){const p=S.items.get(ok.dataset.ok);if(!p||ok.classList.contains("on"))return;
    ok.classList.add("on");const row=ok.closest(".cmd-item");S.busy=true;
    await new Promise(r=>setTimeout(r,matchMedia("(prefers-reduced-motion: reduce)").matches?0:260));
    if(row){row.style.height=row.offsetHeight+"px";row.classList.add("gone");await new Promise(r=>setTimeout(r,matchMedia("(prefers-reduced-motion: reduce)").matches?0:320))}
    trace(p.fournisseur,p.section||"cuisine",[p]);
    p.acommander=false;p.qte=null;S.busy=false;render();
    send("maj_produit",{p_id:p.id,p_champs:{acommander:false,qte:""}}).then(()=>toast(p.nom+" : commandé ✓")).catch(()=>{});return}
  const dn=e.target.closest("[data-done]");
  if(dn){const f=dn.dataset.done;
    if(!dn.classList.contains("confirm")){dn.classList.add("confirm");dn.textContent="Touche encore pour confirmer";setTimeout(()=>{if(dn.isConnected){dn.classList.remove("confirm");dn.textContent="Commande effectuée chez "+f}},4000);return}
    const block=dn.closest(".cmd-sup");const sec=S.sec;S.busy=true;
    await knife(block);
    trace(f,sec,[...S.items.values()].filter(p=>p.fournisseur===f&&(p.section||"cuisine")===sec&&p.acommander));
    [...S.items.values()].forEach(p=>{if(p.fournisseur===f&&(p.section||"cuisine")===sec&&p.acommander){p.acommander=false;p.qte=null}});
    S.busy=false;render();
    send("commande_effectuee_fournisseur",{p_fournisseur:f,p_section:sec}).then(()=>toast("Commande "+f+" effectuée")).catch(()=>{})}
});

/* Envoi de la commande au maraîcher : message tout prêt (WhatsApp, SMS…) */
function sendSupplier(f){
  const ps=itemsOf(f).filter(p=>p.acommander);if(!ps.length)return;
  const pl=(u,q)=>q>1&&/^(pièce|botte|barquette|bouteille|carton|colis|sac|seau|pack|douzaine)$/.test(u)?u+"s":u;
  const lignes=ps.map(p=>`- ${p.nom}${p.qte?` : ${fmt(p.qte)} ${pl(p.unite,p.qte)}`:""}`).join("\n");
  const text=`Bonjour, si possible en livraison demain au Double B :\n\n${lignes}\n\nMerci !`;
  const tel=(S.fiches[f]&&S.fiches[f].tel||"").replace(/[^\d+]/g,"");
  if(navigator.share){navigator.share({text}).catch(()=>{});return}
  if(tel){location.href=`sms:${tel}?&body=${encodeURIComponent(text)}`;return}
  navigator.clipboard.writeText(text).then(()=>toast("Message copié : colle-le dans WhatsApp ou SMS")).catch(()=>prompt("Copie ce message :",text));
}

/* Fiche fournisseur : téléphone, commercial, jours de commande et de livraison… */
const FICHE=[["tel","📞 Téléphone","tel","ex. 06 12 34 56 78"],["commercial","👤 Commercial / contact","text","ex. M. Martin"],["email","✉️ E-mail","email","ex. commandes@fournisseur.fr"],
  ["jours_commande","🗓️ Jours de commande","text","ex. lundi et jeudi avant 11 h"],["jours_livraison","🚚 Jours de livraison","text","ex. mardi et vendredi matin"],["minimum","💶 Minimum de commande","text","ex. 150 € HT"],["notes","📝 Notes","text","ex. code client 12345"]];
function openFiche(f){
  const c=S.fiches[f]||{};const tel=(c.tel||"").replace(/[^\d+]/g,"");
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="Fiche ${esc(f)}"><h3>${esc(f)}</h3><div class="sub">Fiche fournisseur, partagée avec toute l'équipe</div>
    ${tel||c.email?`<div class="seg">${tel?`<a class="btn" href="tel:${esc(tel)}">📞 Appeler</a>`:""}${c.email?`<a class="btn soft" href="mailto:${esc(c.email)}">✉️ Écrire</a>`:""}</div>`:""}
    ${FICHE.map(([k,l,t,ph])=>`<div class="field"><label for="fi_${k}">${l}</label>${k==="notes"?`<textarea id="fi_${k}" maxlength="500" placeholder="${ph}" style="font:inherit;font-size:17px;min-height:70px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunken);padding:10px 12px;font-size:17px">${esc(c[k]||"")}</textarea>`:`<input id="fi_${k}" type="${t}" maxlength="200" placeholder="${ph}" value="${esc(c[k]||"")}">`}</div>`).join("")}
    <div class="acts"><button class="btn" type="button" id="fiSave">Enregistrer la fiche</button><button class="btn soft" type="button" id="fiClose">Fermer</button></div></div>`;
  document.body.appendChild(m);const close=()=>m.remove();
  m.addEventListener("click",e=>{if(e.target===m)close()});$("#fiClose").onclick=close;

    S.fiches[f]=Object.keys(fiche).length?fiche:undefined;close();render();
    send("fournisseur_fiche",{p_nom:f,p_fiche:fiche}).then(r=>{if(r!==null||!OUT.length)toast("Fiche enregistrée ✓")}).catch(()=>{})};
}

/* Historique des commandes passées (les 60 dernières de la partie affichée) */
$("#histBtn").onclick=async()=>{
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="Historique des commandes"><h3>🕘 Historique — ${esc(SECN[S.sec])}</h3><div id="hList"><div class="sub">Chargement…</div></div><button class="btn soft" type="button" id="hClose">Fermer</button></div>`;
  document.body.appendChild(m);const close=()=>m.remove();m.addEventListener("click",e=>{if(e.target===m)close()});$("#hClose").onclick=close;
  try{const h=await rpc("commandes_historique",{p_section:S.sec});const N={julien:"Julien",eric:"Eric",thierry:"Thierry",claire:"Claire"};
    $("#hList").innerHTML=h.length?h.map(c=>`<details class="hc"><summary><b>${esc(new Date(c.le).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}))}</b> · ${esc(c.fournisseur)} <span class="hn">${c.lignes.length} article${c.lignes.length>1?"s":""}${c.par&&N[c.par]?" · "+N[c.par]:""}</span></summary>
      <ul>${c.lignes.map(l=>`<li>${esc(l.n)}${l.q?` <span>${fmt(+l.q)} ${esc(l.u||"")}</span>`:""}</li>`).join("")}</ul></details>`).join("")
      :`<div class="sub">Pas encore de commande enregistrée. Elles apparaîtront ici dès la prochaine « Commande effectuée » ou case « Commandé ».</div>`;
  }catch{$("#hList").innerHTML=`<div class="sub">Historique indisponible (connexion).</div>`}
};

/* Sauvegarde manuelle : un fichier avec toutes les données de l'appli */
$("#backup").onclick=async()=>{
  try{const d=await rpc("sauvegarde");const blob=new Blob([JSON.stringify(d,null,1)],{type:"application/json"});const name=`Sauvegarde Double B ${new Date().toISOString().slice(0,10)}.json`;
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name}).catch(()=>{});return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Sauvegarde téléchargée")}
  catch{toast("Sauvegarde impossible : vérifie la connexion")}
};

/* Coup de couteau : le bloc est tranché en diagonale, les deux morceaux s'écartent, la liste se resserre (< 1 s) */
function knife(block){return new Promise(res=>{
  if(!block||matchMedia("(prefers-reduced-motion: reduce)").matches){res();return}
  const r=block.getBoundingClientRect(),W=r.width,H=r.height;
  const wrap=document.createElement("div");wrap.className="cut";wrap.style.height=H+"px";
  const a=block.cloneNode(true),b=block.cloneNode(true);
  a.style.clipPath="polygon(0 0,100% 0,100% 100%)";b.style.clipPath="polygon(0 0,0 100%,100% 100%)";
  const slash=document.createElementNS("http://www.w3.org/2000/svg","svg");slash.setAttribute("class","slash");slash.setAttribute("viewBox",`0 0 ${W} ${H}`);slash.setAttribute("preserveAspectRatio","none");
  slash.innerHTML=`<line x1="0" y1="0" x2="${W}" y2="${H}" stroke="#1d1b17" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-dasharray="${Math.hypot(W,H)}" stroke-dashoffset="${Math.hypot(W,H)}"/>`;
  const k=document.createElement("div");k.className="knife";
  k.innerHTML=`<svg viewBox="0 0 64 64"><path d="M6 6 L40 30 L34 36 Z" fill="#e8ecef" stroke="#8a9299" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 6 L40 30" stroke="#fff" stroke-width="1.5"/><rect x="36" y="31" width="22" height="9" rx="3.5" transform="rotate(38 36 31)" fill="#5a3a22"/><circle cx="44" cy="40" r="1.4" fill="#d9b48a"/><circle cx="50" cy="44.6" r="1.4" fill="#d9b48a"/></svg>`;
  block.replaceWith(wrap);wrap.append(b,a,slash,k);
  const ang=Math.atan2(H,W)*180/Math.PI;
  k.animate([{transform:`translate(-56px,-56px) rotate(${ang-38}deg)`},{transform:`translate(${W-8}px,${H-8}px) rotate(${ang-38}deg)`}],{duration:300,easing:"cubic-bezier(.4,0,.6,1)",fill:"forwards"});
  slash.querySelector("line").animate([{strokeDashoffset:Math.hypot(W,H)},{strokeDashoffset:0}],{duration:300,easing:"cubic-bezier(.4,0,.6,1)",fill:"forwards"});
  setTimeout(()=>{const dx=Math.sin(ang*Math.PI/180)*44,dy=Math.cos(ang*Math.PI/180)*44;
    a.style.transform=`translate(${dx}px,${-dy}px) rotate(3deg)`;a.style.opacity="0";
    b.style.transform=`translate(${-dx}px,${dy}px) rotate(-3deg)`;b.style.opacity="0";
    slash.style.transition="opacity .2s";slash.style.opacity="0";k.style.transition="opacity .15s";k.style.opacity="0"},300);
  setTimeout(()=>{wrap.style.transition="height .2s ease,margin .2s ease";wrap.style.height="0px";wrap.style.marginTop="0px"},600);
  setTimeout(()=>{wrap.remove();res()},820);
})}

/* Ajout : nouveau fournisseur et nouveau produit (avec contrôle des doublons) */
$("#addSup").onclick=()=>{
  const n=$("#nSup").value.trim();if(!n)return;
  if(allSups().some(f=>norm(f)===norm(n))){toast(n+" existe déjà");return}
  S.sups=[...S.sups,n];S.supSec[n]=S.sec;setOpen(n,true);$("#nSup").value="";render();$("#nFour").value=n;
  send("ajout_fournisseur",{p_nom:n,p_section:S.sec}).then(()=>toast("Fournisseur "+n+" créé")).catch(()=>{});
};
$("#nSup").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#addSup").click()}});
$("#addForm").addEventListener("submit",async e=>{
  e.preventDefault();const nom=$("#nNom").value.trim();if(!nom)return;const f=$("#nFour").value;const sec=S.sec;
  const dup=[...S.items.values()].find(p=>p.fournisseur===f&&norm(p.nom)===norm(nom));
  if(dup){
    const c=await ask("Cet article existe déjà",`<b>${esc(dup.nom)}</b> existe déjà chez <b>${esc(f)}</b>${(dup.section||"cuisine")!==sec?` (partie ${SECN[dup.section||"cuisine"]})`:""}.`,
      [{label:"Garder les deux",value:"both",cls:"soft"},{label:"Remplacer l'article existant",value:"replace"},{label:"Annuler",value:null,cls:"soft"}]);
    if(!c)return;
    if(c==="replace"){dup.nom=nom;dup.section=sec;render();$("#nNom").value="";
      send("maj_produit",{p_id:dup.id,p_champs:{nom,section:sec}}).then(()=>toast("Article remplacé")).catch(()=>{});return}
  }
  const tmp="tmp-"+Date.now();S.items.set(tmp,{id:tmp,nom,fournisseur:f,section:sec,acommander:false,qte:null,unite:"pièce",ordre:Date.now()});
  setOpen(f,true);render();$("#nNom").value="";$("#nNom").focus();
  send("ajout_produit",{p_nom:nom,p_fournisseur:f,p_section:sec}).then(()=>toast(nom+" ajouté chez "+f)).catch(()=>{});
});

/* Modifier un article : nom, fournisseur, Cuisine / Boissons */
function openEdit(id){
  const p=S.items.get(id);if(!p||String(id).startsWith("tmp-"))return;let sec=p.section||"cuisine";
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="Modifier ${esc(p.nom)}"><h3>Modifier l'article</h3>
    <div class="field"><label for="eNom">Nom</label><input id="eNom" maxlength="80" value="${esc(p.nom)}"></div>
    <div class="field"><label for="eFour">Fournisseur</label><select id="eFour">${allSups().map(f=>`<option${f===p.fournisseur?" selected":""}>${esc(f)}</option>`).join("")}</select></div>
    <div class="field"><label>Partie</label><div class="seg"><button type="button" data-es="cuisine" aria-pressed="${sec==="cuisine"}">🍳 Cuisine</button><button type="button" data-es="boissons" aria-pressed="${sec==="boissons"}">🍸 Bar &amp; Salle</button></div></div>
    <div class="acts"><button class="btn" type="button" id="eSave">Enregistrer</button><button class="btn soft" type="button" id="eCancel">Annuler</button></div></div>`;
  document.body.appendChild(m);
  m.querySelectorAll("[data-es]").forEach(b=>b.onclick=()=>{sec=b.dataset.es;m.querySelectorAll("[data-es]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const close=()=>m.remove();m.addEventListener("click",e=>{if(e.target===m)close()});$("#eCancel").onclick=close;
  $("#eSave").onclick=()=>{
    const nom=$("#eNom").value.trim(),f=$("#eFour").value;if(!nom){$("#eNom").focus();return}
    const champs={};if(nom!==p.nom)champs.nom=nom;if(f!==p.fournisseur)champs.fournisseur=f;if(sec!==(p.section||"cuisine"))champs.section=sec;
    close();if(!Object.keys(champs).length)return;
    Object.assign(p,{nom,fournisseur:f,section:sec});render();
    send("maj_produit",{p_id:p.id,p_champs:champs}).then(()=>toast(sec!==S.sec?`Déplacé dans ${SECN[sec]}`:"Article modifié")).catch(()=>{});
  };
}

/* Le même article chez les autres fournisseurs (nom identique, accents et majuscules mis à part) */
function ailleurs(p){const k=fold(p.nom).replace(/\s+/g," ").trim();
  const o=[...S.items.values()].filter(x=>x.id!==p.id&&fold(x.nom).replace(/\s+/g," ").trim()===k);if(!o.length)return "";
  return `<div class="ailleurs"><h4>Aussi chez</h4>${o.map(x=>`<div><span>${esc(x.fournisseur)}</span>${chip(x)}</div>`).join("")}</div>`}

/* Fenêtre prix : saisie + promo + historique */
async function openPrice(id,o={}){
  const p=S.items.get(id);if(!p||String(id).startsWith("tmp-"))return;
  const last=p.prix;const u0=last?last.u:(PUNITS.includes(p.unite)?p.unite:"kg");
  const m=document.createElement("div");m.className="sheet";
  m.innerHTML=`<div class="box" role="dialog" aria-label="Prix de ${esc(p.nom)}">
    <h3>${esc(p.nom)}</h3><div class="sub">${esc(p.fournisseur)} · ${last?`dernier prix ${eur(+last.p)}/${esc(last.u)} le ${dshort(last.le)}${last.promo?" (promo)":""}`:"aucun prix noté"}</div>
    ${o.recherche?`<div class="fcmd" data-nodirty><span id="fcTxt"></span><button class="btn fct" type="button" data-t="${p.id}"></button></div>${ailleurs(p)}`:""}
    <div class="prow"><div class="in"><input id="pv" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Prix"><span>€</span></div>
      <select id="pu" aria-label="Unité du prix">${PUNITS.map(u=>`<option value="${u}"${u===u0?" selected":""}>par ${u}</option>`).join("")}</select></div>
    <label class="promo"><span>🏷️ En promo</span><span class="sw"><input type="checkbox" id="pp"><i></i></span></label>
    <button class="btn" id="psave" type="button">Enregistrer le prix du jour</button>
    <div class="hist" id="ph"><h4><span>Historique des achats</span><span></span></h4><div class="hrow"><span class="dt">Chargement…</span></div></div>
    <button class="btn soft" id="pclose" type="button">Fermer</button></div>`;
  document.body.appendChild(m);
  // depuis la recherche : on revient à la recherche, texte toujours là
  const close=()=>{m.remove();refresh();if(o.recherche&&S.q){const q=$("#q");q.focus({preventScroll:true});q.setSelectionRange(q.value.length,q.value.length)}};
  m.addEventListener("click",e=>{if(e.target===m)close()});$("#pclose").onclick=close;
  if(o.recherche){const sync=()=>{const b=m.querySelector(".fcmd .fct");b.classList.toggle("soft",p.acommander);b.textContent=p.acommander?"Retirer":"Commander";
      $("#fcTxt").textContent=p.acommander?"✓ Dans la liste à commander":"Pas encore commandé"};
    sync();m.querySelector(".fcmd").addEventListener("click",()=>setTimeout(sync,0))}
  else setTimeout(()=>$("#pv").focus(),150);
  async function hist(){
    try{const h=await rpc("historique_prix",{p_id:id});
      const first=h[h.length-1],cur=h[0];const tot=h.length>1?varPct(cur,first):null;
      $("#ph").innerHTML=`<h4><span>Historique des achats</span><span>${tot!=null?`depuis le ${dshort(first.le)} ${varHTML(tot)}`:""}</span></h4>`+
        (h.length?h.map((x,i)=>`<div class="hrow"><span class="dt">${dshort(x.le)}</span><b>${eur(+x.p)}/${esc(x.u)}</b>${x.promo?PROMO:""}${varHTML(varPct(x,h[i+1]))}<button class="x" data-hx="${x.id}" aria-label="Supprimer ce prix">×</button></div>`).join("")
        :`<div class="hrow"><span class="dt">Pas encore de prix. Note-le à chaque commande pour suivre les hausses.</span></div>`);
    }catch(e){$("#ph").innerHTML=`<div class="hrow"><span class="dt">Historique indisponible (connexion).</span></div>`}
  }
  $("#ph").addEventListener("click",async e=>{const b=e.target.closest("[data-hx]");if(!b)return;
    const ok=await ask("Supprimer ce prix ?","Il sera retiré de l'historique.",[{label:"Oui, supprimer",value:true,cls:"danger"},{label:"Annuler",value:false,cls:"soft"}]);if(!ok)return;
    try{await rpc("suppr_prix",{p_prix_id:+b.dataset.hx});toast("Prix supprimé");hist()}catch{toast("Pas supprimé : vérifie la connexion")}});
  const save=async()=>{
    const v=parseFloat(String($("#pv").value).replace(/\s|€/g,"").replace(",","."));
    if(!v||v<=0||v>100000){toast("Entre un prix, ex. 2,40");$("#pv").focus();return}
    const promo=$("#pp").checked;$("#psave").disabled=true;
    try{await rpc("ajout_prix",{p_id:id,p_prix:v,p_unite:$("#pu").value,p_promo:promo});toast(`Prix noté : ${eur(v)}/${$("#pu").value}${promo?" (promo)":""}`);
      m.querySelector(".sub").textContent=`${p.fournisseur} · dernier prix ${eur(v)}/${$("#pu").value} aujourd'hui${promo?" (promo)":""}`;$("#pv").value="";$("#pp").checked=false;
      window.Profil&&Profil.saved&&Profil.saved($("#pv"));await hist()}
    catch{toast("Pas enregistré : vérifie la connexion")}finally{$("#psave").disabled=false}
  };
  $("#psave").onclick=save;$("#pv").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save()}});
  hist();
}
