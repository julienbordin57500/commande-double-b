<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Ma carte fidélité · Double B</title>
<meta name="theme-color" content="#0c0a07">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0a07;color:#f5efe3;font:16px system-ui,sans-serif;text-align:center;padding:16px}a{color:#ffd23f}</style>
<script>
/* La carte client a déménagé sur https://carte.doubleb-folschviller.fr (dépôt carte-double-b).
   Les anciens liens arrivent ici : on garde le jeton (après #, ou celui retenu sur ce téléphone) et on renvoie. */
(function(){var j=(location.hash||"").slice(1).toLowerCase();
if(!/^[0-9a-f]{32}$/.test(j)){try{j=localStorage.getItem("2b-carte")||""}catch(e){j=""}}
location.replace("https://carte.doubleb-folschviller.fr/"+(j?"#"+j:""));})();
</script>
</head>
<body><p>Ta carte fidélité s'ouvre…<br><a href="https://carte.doubleb-folschviller.fr/">Ouvrir ma carte</a></p></body>
</html>
